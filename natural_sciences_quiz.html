<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naturwissenschaften – Quizsammlung Klasse 6</title>
<style>
/* =========================
   GLOBAL RESET & BASE
   ========================= */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: #f3f4f6; color: #1f2937; line-height: 1.5; }

button { font-family: inherit; cursor: pointer; border: none; }

/* =========================
   MENU (Hub)
   ========================= */
.menu-screen {
  min-height: 100vh;
  background: linear-gradient(135deg, #312e81 0%, #1e40af 50%, #0e7490 100%);
  padding: 40px 20px;
}
.menu-screen h1 {
  text-align: center;
  color: #fff;
  font-size: 2.4rem;
  margin-bottom: 8px;
  text-shadow: 0 4px 12px rgba(0,0,0,0.3);
}
.menu-screen .subtitle {
  text-align: center;
  color: #e0e7ff;
  font-size: 1.1rem;
  margin-bottom: 36px;
}
.menu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 18px;
  max-width: 1100px;
  margin: 0 auto;
}
.menu-card {
  background: rgba(255,255,255,0.95);
  border-radius: 14px;
  padding: 22px;
  cursor: pointer;
  transition: transform 0.18s, box-shadow 0.18s;
  box-shadow: 0 6px 18px rgba(0,0,0,0.15);
  border: none;
  text-align: left;
  width: 100%;
}
.menu-card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(0,0,0,0.25); }
.menu-card .letter {
  display: inline-block;
  background: #1e40af;
  color: #fff;
  width: 32px; height: 32px;
  border-radius: 50%;
  text-align: center;
  line-height: 32px;
  font-weight: 700;
  margin-bottom: 10px;
}
.menu-card h3 {
  font-size: 1.05rem;
  color: #111827;
  margin-bottom: 6px;
}
.menu-card .topic {
  color: #4b5563;
  font-size: 0.9rem;
}
.menu-card .authors {
  color: #6b7280;
  font-size: 0.8rem;
  margin-top: 8px;
  font-style: italic;
}

/* Back button (shared) */
.back-btn {
  position: fixed;
  top: 14px; left: 14px;
  background: rgba(0,0,0,0.55);
  color: #fff;
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 0.9rem;
  z-index: 10000;
  backdrop-filter: blur(4px);
}
.back-btn:hover { background: rgba(0,0,0,0.8); }

/* Quiz screens hidden initially */
.quiz-screen { display: none; min-height: 100vh; }
.quiz-screen.active { display: block; }

/* Hide any inner back buttons inside quiz screens — the global #back-btn handles navigation */
.quiz-screen .back-btn { display: none !important; }

/* =========================
   A) Vogelflug — Anika & Lina
   ========================= */
#quiz-a {
  background: linear-gradient(180deg, #87ceeb 0%, #b6e0f5 100%);
  position: relative;
  overflow: hidden;
}
#quiz-a .clouds, #quiz-a .birds {
  position: absolute; inset: 0; pointer-events: none; z-index: 0;
}
#quiz-a .cloud {
  position: absolute;
  font-size: 3rem;
  opacity: 0.85;
  animation: floatCloud 30s linear infinite;
}
#quiz-a .bird {
  position: absolute;
  font-size: 1.8rem;
  animation: flyBird 18s linear infinite;
}
@keyframes floatCloud {
  0% { transform: translateX(-150px); }
  100% { transform: translateX(calc(100vw + 150px)); }
}
@keyframes flyBird {
  0%   { transform: translateX(-100px) translateY(0); }
  50%  { transform: translateX(50vw) translateY(-20px); }
  100% { transform: translateX(calc(100vw + 100px)) translateY(0); }
}
#quiz-a .content-card {
  position: relative;
  z-index: 2;
  max-width: 720px;
  margin: 60px auto;
  background: rgba(255,255,255,0.96);
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 12px 36px rgba(0,0,0,0.15);
}
#quiz-a h2 {
  color: #1e3a8a;
  text-align: center;
  margin-bottom: 6px;
}
#quiz-a .score-bar {
  text-align: center;
  font-weight: 600;
  color: #0c4a6e;
  margin-bottom: 18px;
}
#quiz-a .question { font-size: 1.15rem; margin-bottom: 14px; color: #111827; }
#quiz-a .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
#quiz-a .option-btn {
  background: #e0f2fe;
  color: #0c4a6e;
  padding: 12px 16px;
  border-radius: 10px;
  text-align: left;
  font-size: 1rem;
  border: 2px solid transparent;
  transition: all 0.15s;
}
#quiz-a .option-btn:hover:not(:disabled) { background: #bae6fd; border-color: #0284c7; }
#quiz-a .option-btn.correct { background: #bbf7d0; border-color: #16a34a; }
#quiz-a .option-btn.wrong { background: #fecaca; border-color: #dc2626; }
#quiz-a .option-btn:disabled { cursor: not-allowed; opacity: 0.85; }
#quiz-a .hint-btn { background: #fef3c7; color: #92400e; padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 10px; }
#quiz-a .feedback {
  background: #f3f4f6;
  border-left: 4px solid #0284c7;
  padding: 12px;
  margin-top: 10px;
  border-radius: 6px;
  display: none;
}
#quiz-a .feedback.show { display: block; }
#quiz-a .feedback.wrong { border-left-color: #dc2626; background: #fef2f2; }
#quiz-a .feedback.right { border-left-color: #16a34a; background: #f0fdf4; }
#quiz-a .nav-btn { background: #1e40af; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 1rem; margin-top: 10px; }
#quiz-a .nav-btn:hover { background: #1e3a8a; }
#quiz-a .trophy { font-size: 5rem; text-align: center; animation: bounce 1s infinite; }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
#quiz-a .confetti-piece {
  position: fixed;
  width: 10px; height: 14px;
  top: -20px;
  z-index: 5000;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  to { transform: translateY(110vh) rotate(720deg); }
}
#quiz-a .sources { font-size: 0.85rem; color: #4b5563; margin-top: 18px; line-height: 1.6; }
#quiz-a .sources a { color: #1e40af; word-break: break-all; }

/* =========================

/* =========================
   F) Drones (English) — Section F
   ========================= */
#quiz-f {
  background: linear-gradient(180deg, #3b82f6 0%, #60a5fa 50%, #93c5fd 100%);
  min-height: 100vh;
  padding: 30px 20px;
  position: relative;
  overflow: hidden;
}
#quiz-f .cloud-anim {
  position: absolute;
  font-size: 3rem;
  opacity: 0.7;
  animation: cloudFadeUp 18s linear infinite;
}
@keyframes cloudFadeUp {
  0% { transform: translateY(0); opacity: 0.7; }
  100% { transform: translateY(-300px); opacity: 0; }
}
#quiz-f .sinking-drone {
  position: absolute;
  font-size: 4rem;
  left: 50%;
  transform: translateX(-50%);
  animation: droneSink 8s ease-in-out infinite alternate;
  z-index: 1;
}
@keyframes droneSink {
  0% { top: 80px; }
  100% { top: calc(100vh - 200px); }
}

#quiz-f .content-card {
  background: rgba(255,255,255,0.95);
  border-radius: 12px;
  padding: 22px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);

let currentLang = 'de';

function tt(key, params) {
  // Get nested value: key like "qa.header" or "back_btn"
  const parts = key.split('.');
  let v = I18N[currentLang];
  for (const p of parts) { if (v && v[p] !== undefined) v = v[p]; else return key; }
  if (typeof v === 'string' && params) {
    Object.keys(params).forEach(k => { v = v.replace(new RegExp('\\{' + k + '\\}', 'g'), params[k]); });
  }
  return v;
}

/* =========================
   COMPLETION TRACKING
   ========================= */
const QUIZ_LETTERS = ['a','b','c','d','e','f','g','h','i'];
const CATEGORY_OF = {
  a: 'flying', c: 'flying', d: 'flying', f: 'flying',
  b: 'nutrition', e: 'nutrition', h: 'nutrition', i: 'nutrition',
  g: 'floating'
};
const completed = new Set();
const feedbacks = {}; // letter -> {text, savedAt}

function markCompleted(letter) {
  if (completed.has(letter)) return;
  completed.add(letter);
  updateProgressUI();
  const fab = document.getElementById('feedback-fab');
  if (fab && currentQuizLetter === letter) {
    fab.style.display = 'flex';
    updateFabState();
  }
}

function updateProgressUI() {
  const done = completed.size;
  const total = QUIZ_LETTERS.length;
  document.getElementById('progress-count').textContent = `${done} / ${total}`;
  document.getElementById('progress-fill').style.width = (100 * done / total) + '%';
  ['floating','nutrition','flying'].forEach(cat => {
    const inCat = QUIZ_LETTERS.filter(l => CATEGORY_OF[l] === cat);
    const doneInCat = inCat.filter(l => completed.has(l)).length;
    document.getElementById('cat-count-' + cat).textContent = `${doneInCat} / ${inCat.length}`;
  });
  QUIZ_LETTERS.forEach(l => {
    const card = document.querySelector('.menu-card[data-letter="' + l + '"]');
    if (card) card.classList.toggle('done', completed.has(l));
  });
  // Update export panel sub-line
  const fbCount = QUIZ_LETTERS.filter(l => feedbacks[l]).length;
  const sub = document.getElementById('export-sub');
  if (sub) {
    if (fbCount === 0) sub.textContent = tt('export_none');
    else if (fbCount === QUIZ_LETTERS.length) sub.textContent = tt('export_sub_full');
    else sub.textContent = tt('export_sub_partial') + ' (' + fbCount + '/' + QUIZ_LETTERS.length + ')';
  }
}

/* =========================
   LANGUAGE SWITCHING
   ========================= */
function setLang(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;
  document.getElementById('lang-de').classList.toggle('active', lang === 'de');
  document.getElementById('lang-en').classList.toggle('active', lang === 'en');
  const dict = I18N[lang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (dict[key]) el.textContent = dict[key];
  });
  document.querySelectorAll('[data-q-title]').forEach(el => {
    const letter = el.dataset.qTitle;
    if (dict.q[letter]) el.textContent = dict.q[letter].title;
  });
  document.querySelectorAll('[data-q-topic]').forEach(el => {
    const letter = el.dataset.qTopic;
    if (dict.q[letter]) el.textContent = dict.q[letter].topic;
  });
  const ta = document.getElementById('feedback-text');
  if (ta) ta.placeholder = dict.feedback_placeholder;
  updateFeedbackModalTitle();
  updateProgressUI();
  // Re-render currently active quiz if any
  if (currentQuizLetter) {
    const initFn = window['initQuiz' + currentQuizLetter.toUpperCase()];
    if (typeof initFn === 'function') initFn();
  }
}

/* =========================
   NAVIGATION
   ========================= */
let currentQuizLetter = null;

function showMenu() {
  currentQuizLetter = null;
  document.querySelectorAll('.quiz-screen').forEach(el => el.classList.remove('active'));
  document.getElementById('menu-screen').style.display = 'block';
  document.getElementById('back-btn').style.display = 'none';
  document.getElementById('feedback-fab').style.display = 'none';
  window.scrollTo(0, 0);
}

function showCategory(cat) {
  const list = document.getElementById('list-' + cat);
  const card = document.querySelector('.category-card[data-cat="' + cat + '"]');
  const wasActive = list.classList.contains('active');
  document.querySelectorAll('.quiz-list').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.category-card').forEach(c => c.classList.remove('active'));
  if (!wasActive) {
    list.classList.add('active');
    card.classList.add('active');
    setTimeout(() => list.scrollIntoView({behavior: 'smooth', block: 'start'}), 60);
  }
}

function showQuiz(letter) {
  currentQuizLetter = letter;
  document.getElementById('menu-screen').style.display = 'none';
  document.querySelectorAll('.quiz-screen').forEach(el => el.classList.remove('active'));
  document.getElementById('quiz-' + letter).classList.add('active');
  document.getElementById('back-btn').style.display = 'block';
  const fab = document.getElementById('feedback-fab');
  if (completed.has(letter)) {
    fab.style.display = 'flex';
    updateFabState();
  } else {
    fab.style.display = 'none';
  }
  if (typeof window['initQuiz' + letter.toUpperCase()] === 'function') {
    window['initQuiz' + letter.toUpperCase()]();
  }
  window.scrollTo(0, 0);
}

/* =========================
   COMPLETION DETECTION (auto via observer)
   ========================= */
function setupCompletionObservers() {
  QUIZ_LETTERS.forEach(letter => {
    const container = document.getElementById('quiz-' + letter);
    if (!container) return;
    const obs = new MutationObserver(() => {
      const restartBtn = container.querySelector(
        `button[onclick*="initQuiz${letter.toUpperCase()}()"]`
      );
      if (restartBtn) markCompleted(letter);
    });
    obs.observe(container, { childList: true, subtree: true });
  });
}

/* =========================
   FEEDBACK SYSTEM
   ========================= */
function updateFabState() {
  const fab = document.getElementById('feedback-fab');
  if (!fab || !currentQuizLetter) return;
  if (feedbacks[currentQuizLetter]) {
    fab.classList.add('has-feedback');
    fab.querySelector('span:last-child').textContent = '✓ ' + tt('feedback_btn');
  } else {
    fab.classList.remove('has-feedback');
    fab.querySelector('span:last-child').textContent = tt('feedback_btn');
  }
}

function updateFeedbackModalTitle() {
  if (!currentQuizLetter) return;
  const title = document.getElementById('feedback-modal-title');
  if (title) {
    const qInfo = I18N[currentLang].q[currentQuizLetter];
    title.textContent = `${currentQuizLetter.toUpperCase()}) ${qInfo.title} – ${tt('feedback_btn')}`;
  }
}

function openFeedback() {
  if (!currentQuizLetter) return;
  if (!completed.has(currentQuizLetter)) {
    alert(tt('feedback_after_quiz'));
    return;
  }
  updateFeedbackModalTitle();
  const ta = document.getElementById('feedback-text');
  ta.value = feedbacks[currentQuizLetter] ? feedbacks[currentQuizLetter].text : '';
  ta.placeholder = tt('feedback_placeholder');
  document.getElementById('feedback-delete-btn').style.display = feedbacks[currentQuizLetter] ? 'inline-block' : 'none';
  document.getElementById('feedback-modal').classList.add('active');
  setTimeout(() => ta.focus(), 60);
}

function closeFeedback() {
  document.getElementById('feedback-modal').classList.remove('active');
}

function saveFeedback() {
  if (!currentQuizLetter) return;
  const text = document.getElementById('feedback-text').value.trim();
  if (!text) {
    alert(tt('feedback_placeholder'));
    return;
  }
  feedbacks[currentQuizLetter] = {
    text: text,
    savedAt: new Date().toISOString()
  };
  updateFabState();
  updateProgressUI();
  closeFeedback();
}

function deleteFeedback() {
  if (!currentQuizLetter) return;
  delete feedbacks[currentQuizLetter];
  updateFabState();
  updateProgressUI();
  closeFeedback();
}

/* =========================
   EXPORT
   ========================= */
function buildExportHTML() {
  const dict = I18N[currentLang];
  const now = new Date().toLocaleString(currentLang === 'de' ? 'de-DE' : 'en-GB');
  const heading = currentLang === 'de' ? 'Feedback-Übersicht – Quizsammlung Klasse 6' : 'Feedback Overview – Grade 6 Quiz Collection';
  const exportedOn = currentLang === 'de' ? 'Exportiert am' : 'Exported on';
  let body = '';
  QUIZ_LETTERS.forEach(letter => {
    const qInfo = dict.q[letter];
    const fb = feedbacks[letter];
    body += `
    <section class="entry">
      <h2><span class="letter">${letter.toUpperCase()}</span> ${escapeHtml(qInfo.title)}</h2>
      <p class="topic">${escapeHtml(qInfo.topic)}</p>
      <div class="feedback-text">${fb ? escapeHtml(fb.text).replace(/\n/g, '<br>') : '<em style="color:#9ca3af;">— ' + (currentLang === 'de' ? 'kein Feedback' : 'no feedback') + ' —</em>'}</div>
    </section>`;
  });
  return `<!DOCTYPE html>
<html lang="${currentLang}">
<head>
<meta charset="UTF-8">
<title>${escapeHtml(heading)}</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 820px; margin: 30px auto; padding: 20px; color: #1f2937; line-height: 1.6; }
  h1 { color: #1e40af; border-bottom: 3px solid #1e40af; padding-bottom: 10px; }
  .meta { color: #6b7280; font-size: 0.9rem; margin-bottom: 24px; }
  .entry { background: #f9fafb; border-left: 4px solid #1e40af; border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; page-break-inside: avoid; }
  .entry h2 { color: #111827; font-size: 1.15rem; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
  .letter { display: inline-block; background: #1e40af; color: #fff; width: 28px; height: 28px; border-radius: 50%; text-align: center; line-height: 28px; font-size: 0.95rem; flex-shrink: 0; }
  .topic { color: #6b7280; font-size: 0.85rem; margin-bottom: 10px; }
  .feedback-text { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; padding: 12px; white-space: pre-wrap; }
  @media print { body { margin: 0; } .entry { break-inside: avoid; } }
</style>
</head>
<body>
  <h1>${escapeHtml(heading)}</h1>
  <p class="meta">${exportedOn}: ${now}</p>
  ${body}
</body>
</html>`;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function exportHTML() {
  const fbCount = QUIZ_LETTERS.filter(l => feedbacks[l]).length;
  if (fbCount === 0) { alert(tt('export_none')); return; }
  const html = buildExportHTML();
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `quiz-feedback-${stamp}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportPDF() {
  const fbCount = QUIZ_LETTERS.filter(l => feedbacks[l]).length;
  if (fbCount === 0) { alert(tt('export_none')); return; }
  const html = buildExportHTML();
  const win = window.open('', '_blank');
  win.document.open();
  win.document.write(html);
  win.document.close();
  setTimeout(() => { win.focus(); win.print(); }, 400);
}

/* =========================
   HELPERS for bilingual rendering
   ========================= */
function L(field) {
  // Accept either a string or {de, en} object; return current-language string
  if (field == null) return '';
  if (typeof field === 'string') return field;
  if (typeof field === 'object') return field[currentLang] || field.de || field.en || '';
  return String(field);
}

/* ========================================================
   QUIZ A — Bird Flight (Anika & Lina)
   ======================================================== */
function initQuizA() {
  const root = document.getElementById('quiz-a');
  let bgHTML = '<div class="clouds">';
  for (let i = 0; i < 5; i++) {
    bgHTML += `<span class="cloud" style="top:${10 + i*15}%; left:${-10 - i*20}%; animation-delay:${i*3}s; font-size:${2.5 + i*0.4}rem;">☁️</span>`;
  }
  bgHTML += '</div><div class="birds">';
  for (let i = 0; i < 4; i++) {
    bgHTML += `<span class="bird" style="top:${20 + i*18}%; animation-delay:${i*4}s;">🕊️</span>`;
  }
  bgHTML += '</div>';

  root.innerHTML = bgHTML + `
    <div class="content-card">
      <h2>${tt('qa.header')}</h2>
      <p style="text-align:center; color:#475569; font-size:0.9rem;">${tt('qa.sub')}</p>
      <div class="score-bar" id="qa-score-bar"></div>
      <div id="qa-content"></div>
    </div>
  `;

  let current = 0;
  let score = 0;
  let answered = false;

  function updateScoreBar() {
    document.getElementById('qa-score-bar').textContent =
      `${tt('q_of', {n: current+1, total: quizA_questions.length})} · ${tt('points')}: ${score}`;
  }

  function render() {
    answered = false;
    const c = document.getElementById('qa-content');
    updateScoreBar();
    if (current >= quizA_questions.length) { renderEnd(); return; }
    const q = quizA_questions[current];
    let html = `<div class="question">${current+1}. ${L(q.q)}</div>`;
    if (q.type === 'mc') {
      html += `<button class="hint-btn" id="qa-hint-btn">${tt('show_hint')}</button>`;
      html += `<div id="qa-hint-text" style="display:none; background:#fef3c7; padding:8px; border-radius:6px; margin-bottom:10px; color:#92400e;">${L(q.hint)}</div>`;
      html += `<div class="options">`;
      L(q.options).forEach((opt, idx) => {
        html += `<button class="option-btn" data-idx="${idx}">${String.fromCharCode(65+idx)}) ${opt}</button>`;
      });
      html += `</div>`;
    } else {
      html += `<div class="options">
        <button class="option-btn" data-idx="true">${tt('true_btn')}</button>
        <button class="option-btn" data-idx="false">${tt('false_btn')}</button>
      </div>`;
    }
    html += `<div class="feedback" id="qa-feedback"></div>`;
    html += `<button class="nav-btn" id="qa-next-btn" style="display:none;">${tt('next_btn')}</button>`;
    c.innerHTML = html;

    if (q.type === 'mc') {
      document.getElementById('qa-hint-btn').addEventListener('click', () => {
        document.getElementById('qa-hint-text').style.display = 'block';
        document.getElementById('qa-hint-btn').disabled = true;
        document.getElementById('qa-hint-btn').style.opacity = 0.5;
      });
    }
    c.querySelectorAll('.option-btn').forEach(btn => {
      btn.addEventListener('click', () => handleAnswer(btn));
    });
    document.getElementById('qa-next-btn').addEventListener('click', () => { current++; render(); });
  }

  function handleAnswer(btn) {
    if (answered) return;
    answered = true;
    const q = quizA_questions[current];
    const fb = document.getElementById('qa-feedback');
    document.querySelectorAll('#qa-content .option-btn').forEach(b => b.disabled = true);

    let correct = false;
    if (q.type === 'mc') {
      const idx = parseInt(btn.dataset.idx);
      correct = idx === q.correct;
      document.querySelectorAll('#qa-content .option-btn')[q.correct].classList.add('correct');
      if (!correct) btn.classList.add('wrong');
    } else {
      const val = btn.dataset.idx === 'true';
      correct = val === q.correct;
      if (correct) btn.classList.add('correct');
      else {
        btn.classList.add('wrong');
        document.querySelectorAll('#qa-content .option-btn').forEach(b => {
          if (b.dataset.idx === String(q.correct)) b.classList.add('correct');
        });
      }
    }

    if (correct) {
      score += 2;
      fb.className = 'feedback show right';
      fb.innerHTML = `<strong>${tt('correct_label')}</strong> ${L(q.explanation)}<br><em>+2 ${tt('point_plural')}</em>`;
    } else {
      score -= 1;
      fb.className = 'feedback show wrong';
      fb.innerHTML = `<strong>${tt('wrong_label')}</strong> ${L(q.explanation)}<br><em>−1 ${tt('point_singular')}</em>`;
    }
    updateScoreBar();
    document.getElementById('qa-next-btn').style.display = 'inline-block';
  }

  function renderEnd() {
    const c = document.getElementById('qa-content');
    const maxScore = quizA_questions.length * 2;
    let html = `<h3 style="text-align:center; color:#1e3a8a;">${tt('quiz_finished')}</h3>`;
    html += `<p style="text-align:center; font-size:1.3rem; margin:14px 0;">${tt('you_scored', {score: score, max: maxScore})}</p>`;
    if (score >= 12) {
      html += `<div class="trophy">🏆</div>`;
      html += `<p style="text-align:center; color:#16a34a; font-weight:700; font-size:1.2rem;">${tt('qa.pro')}</p>`;
      launchConfettiA();
    } else {
      html += `<p style="text-align:center; color:#475569;">${tt('qa.retry')}</p>`;
    }
    html += `<div class="sources">
      <strong>${tt('sources_label')}</strong><br>
      • scinexx.de — <a href="https://www.scinexx.de/dossierartikel/das-geheimnis-des-vogelflugs/" target="_blank">scinexx.de</a><br>
      • Spektrum — <a href="https://www.spektrum.de/lexikon/biologie-kompakt/vogelflug/12592" target="_blank">spektrum.de</a><br>
      • Planet Wissen — <a href="https://www.planet-wissen.de/natur/tierwelt/tierische_flieger/" target="_blank">planet-wissen.de</a><br>
      • Sofatutor — <a href="https://www.sofatutor.at/biologie/videos/federn-und-vogelflug-2" target="_blank">sofatutor.at</a><br>
      • Uni Heidelberg — <a href="https://www.thphys.uni-heidelberg.de/~huefner/PhysikUeberall/V07S.pdf" target="_blank">uni-heidelberg.de</a>
    </div>`;
    html += `<div style="text-align:center;"><button class="nav-btn" onclick="initQuizA()">${tt('restart_btn')}</button></div>`;
    c.innerHTML = html;
  }

  function launchConfettiA() {
    const colors = ['#fbbf24','#f97316','#ef4444','#a855f7','#3b82f6','#22c55e','#ec4899'];
    for (let i = 0; i < 80; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      piece.style.animationDuration = (2 + Math.random()*2) + 's';
      piece.style.animationDelay = Math.random() * 0.5 + 's';
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 5000);
    }
  }

  render();
}

      L(q.options).forEach((opt, idx) => {
        html += `<button class="option-btn" data-idx="${idx}">${opt}</button>`;
      });
      html += `</div>`;
    } else if (q.type === 'estimate') {
      const unit = L(q.unit);
      html += `<input type="number" step="any" class="estimate-input" id="qb-estimate" placeholder="${tt('your_guess', {unit: unit})}">`;
      html += `<button class="nav-btn" id="qb-submit-est">${tt('check_answer')}</button>`;
    }
    html += `<div class="feedback" id="qb-feedback"></div>`;
    html += `<button class="nav-btn" id="qb-next-btn" style="display:none;">${tt('next_btn')}</button>`;
    c.innerHTML = html;

    document.getElementById('qb-next-btn').addEventListener('click', () => { current++; render(); });
    if (q.type === 'mc') {
      c.querySelectorAll('.option-btn').forEach(btn => btn.addEventListener('click', () => handleMC(btn)));
    } else {
      document.getElementById('qb-submit-est').addEventListener('click', handleEstimate);
    }
  }

  function handleMC(btn) {
    const q = quizB_questions[current];
    const idx = parseInt(btn.dataset.idx);
    const fb = document.getElementById('qb-feedback');

    if (idx === q.correct) {
      btn.classList.add('correct');
      document.querySelectorAll('#qb-options .option-btn').forEach(b => b.disabled = true);
      let pts = attempts === 0 ? 2 : (attempts === 1 ? 1 : 0);
      score += pts;
      fb.className = 'feedback show good';
      fb.innerHTML = `<strong>${tt('correct_label')}</strong> ${L(q.explanation)}<br><em>+${pts} ${pts === 1 ? tt('point_singular') : tt('point_plural')}</em>`;
      document.getElementById('qb-next-btn').style.display = 'inline-block';
    } else {
      btn.classList.add('hidden-wrong');
      btn.disabled = true;
      attempts++;
      if (attempts === 1) {
        fb.className = 'feedback show';
        fb.innerHTML = `<strong>${tt('wrong_label')}</strong> <strong>${tt('tip_label')}</strong> ${L(q.hint)}`;
      } else {
        fb.className = 'feedback show';
        fb.innerHTML = `<strong>${tt('also_wrong_label')}</strong> <strong>${tt('explanation_label')}</strong> ${L(q.explanation)}`;
      }
    }
  }

  function handleEstimate() {
    const q = quizB_questions[current];
    const val = parseFloat(document.getElementById('qb-estimate').value);
    const fb = document.getElementById('qb-feedback');
    const unit = L(q.unit);
    if (isNaN(val)) { fb.className = 'feedback show'; fb.innerHTML = tt('enter_number'); return; }

    if (Math.abs(val - q.correctValue) <= q.tolerance) {
      let pts = attempts === 0 ? 2 : 1;
      score += pts;
      fb.className = 'feedback show good';
      fb.innerHTML = `<strong>${tt('correct_label')}</strong> ${tt('correct_answer_is')} ${q.correctValue} ${unit}.<br>${L(q.explanation)}<br><em>+${pts} ${pts === 1 ? tt('point_singular') : tt('point_plural')}</em>`;
      document.getElementById('qb-submit-est').disabled = true;
      document.getElementById('qb-estimate').disabled = true;
      document.getElementById('qb-next-btn').style.display = 'inline-block';
    } else {
      attempts++;
      if (attempts === 1) {
        fb.className = 'feedback show';
        fb.innerHTML = `<strong>${tt('almost_label')}</strong> <strong>${tt('tip_label')}</strong> ${L(q.hint)}`;
      } else {
        fb.className = 'feedback show';
        fb.innerHTML = `<strong>${tt('wrong_label')}</strong> ${tt('correct_answer_is')} <strong>${q.correctValue} ${unit}</strong>.<br>${L(q.explanation)}`;
        document.getElementById('qb-submit-est').disabled = true;
        document.getElementById('qb-estimate').disabled = true;
        document.getElementById('qb-next-btn').style.display = 'inline-block';
      }
    }
  }

  function renderEnd() {
    const c = document.getElementById('qb-content');
    const max = quizB_questions.length * 2;
    const pct = score / max;
    let grade;
    if (pct >= 0.92) grade = '1';
    else if (pct >= 0.81) grade = '2';
    else if (pct >= 0.67) grade = '3';
    else if (pct >= 0.50) grade = '4';
    else if (pct >= 0.30) grade = '5';
    else grade = '6';

    c.innerHTML = `
      <h3 style="text-align:center; color:#78350f;">${tt('qb.finished_emoji')}</h3>
      <p style="text-align:center; font-size:1.2rem; margin:14px 0;">${tt('you_scored', {score: score, max: max})}</p>
      <div style="text-align:center;">${tt('qb.grade_label')}</div>
      <div class="grade-display">${grade}</div>
      <div class="sources">
        <strong>${tt('sources_label')}</strong><br>
        • BZfE — <a href="https://www.bzfe.de" target="_blank">bzfe.de</a><br>
        • DGE — <a href="https://www.dge.de/wissenschaft/referenzwerte/" target="_blank">dge.de</a><br>
        • BZgA — <a href="https://www.bzga-essstoerungen.de" target="_blank">bzga-essstoerungen.de</a><br>
        • WHO — <a href="https://www.who.int/news-room/fact-sheets/detail/healthy-diet" target="_blank">who.int</a><br>
        • Kindergesundheit-info — <a href="https://www.kindergesundheit-info.de" target="_blank">kindergesundheit-info.de</a>
      </div>
      <div style="text-align:center;"><button class="nav-btn" onclick="initQuizB()">${tt('restart_btn')}</button></div>
    `;
  }

  render();
}

    </div>
  `;

  let current = 0;
  let correctCount = 0;
  let yearsLost = 0;
  let answered = false;
  let snailPos = 50;

  function updateSnail() {
    const snail = document.getElementById('qe-snail');
    if (snail) snail.style.left = snailPos + '%';
  }

  function render() {
    answered = false;
    document.getElementById('qe-progress').textContent = tt('q_short', {n: current+1, total: quizE_questions.length});
    const c = document.getElementById('qe-content');
    if (current >= quizE_questions.length) { renderEnd(); return; }
    const q = quizE_questions[current];
    let html = `<div class="question">${current+1}. ${L(q.q)}</div>`;
    if (q.type === 'mc') {
      html += `<div class="options" id="qe-options">`;
      L(q.options).forEach((opt, idx) => {
        html += `<button class="option-btn" data-idx="${idx}">${String.fromCharCode(65+idx)}) ${opt}</button>`;
      });
      html += `</div>`;
    } else if (q.type === 'tf') {
      html += `<div class="options" id="qe-options">
        <button class="option-btn" data-idx="true">${tt('yes_no_yes')}</button>
        <button class="option-btn" data-idx="false">${tt('yes_no_no')}</button>
      </div>`;
    } else if (q.type === 'slider') {
      html += `
        <div class="slider-container">
          <div class="slider-track">
            <input type="range" min="${q.min}" max="${q.max}" step="${q.step}" value="${(q.min+q.max)/2}" class="slider-input" id="qe-slider">
            <div class="slider-emoji" id="qe-slider-emoji" style="left: 50%;">${q.emoji}</div>
          </div>
          <div class="slider-value" id="qe-slider-val">${(q.min+q.max)/2}</div>
          <button class="nav-btn" id="qe-slider-submit">${tt('submit_answer')}</button>
        </div>
      `;
    }
    html += `<div class="feedback" id="qe-feedback"></div>`;
    html += `<button class="nav-btn" id="qe-next-btn" style="display:none;">${tt('next_btn')}</button>`;

    if (q.type === 'mc' || q.type === 'tf') {
      c.querySelectorAll('.option-btn').forEach(btn => btn.addEventListener('click', () => handleAnswer(btn)));
    } else if (q.type === 'slider') {
      const slider = document.getElementById('qe-slider');
      slider.addEventListener('input', () => {
        const pct = (slider.value - q.min) / (q.max - q.min) * 100;
        document.getElementById('qe-slider-emoji').style.left = pct + '%';
        document.getElementById('qe-slider-val').textContent = slider.value;
      });
      document.getElementById('qe-slider-submit').addEventListener('click', handleSlider);
    }
    document.getElementById('qe-next-btn').addEventListener('click', () => { current++; render(); });
  }

  function moveSnail(correct) {
    const step = 50 / quizE_questions.length;
    if (correct) snailPos -= step;
    else snailPos += step;
    snailPos = Math.max(5, Math.min(95, snailPos));
    updateSnail();
  }

  function handleAnswer(btn) {
    if (answered) return;
    answered = true;
    const q = quizE_questions[current];
    const fb = document.getElementById('qe-feedback');
    let correct;
    if (q.type === 'mc') correct = parseInt(btn.dataset.idx) === q.correct;
    else correct = (btn.dataset.idx === 'true') === q.correct;

    document.querySelectorAll('#qe-options .option-btn').forEach(b => b.disabled = true);

    if (correct) {
      btn.classList.add('correct');
      correctCount++;
      fb.className = 'feedback show';
      fb.innerHTML = `<strong style="color:#16a34a;">${tt('correct_label')}</strong> ${L(q.explanation)}`;

      yearsLost += q.yearsCost;
      document.querySelectorAll('#qe-options .option-btn').forEach(b => {
        const matchMC = q.type === 'mc' && parseInt(b.dataset.idx) === q.correct;
        const matchTF = q.type === 'tf' && b.dataset.idx === String(q.correct);
        if (matchMC || matchTF) b.classList.add('correct');
      });
      fb.className = 'feedback show';
      fb.innerHTML = `<strong style="color:#dc2626;">${tt('wrong_label')}</strong> ${L(q.explanation)}`;
    }
    moveSnail(correct);
    document.getElementById('qe-next-btn').style.display = 'inline-block';
  }

  function handleSlider() {
    if (answered) return;
    answered = true;
    const q = quizE_questions[current];
    const val = parseFloat(document.getElementById('qe-slider').value);
    const fb = document.getElementById('qe-feedback');
    document.getElementById('qe-slider').disabled = true;
    document.getElementById('qe-slider-submit').disabled = true;

    const correct = Math.abs(val - q.correctValue) <= q.tolerance;

      fb.className = 'feedback show';
      fb.innerHTML = `<strong style="color:#16a34a;">${tt('qe.good_guess')}</strong> ${tt('correct_answer_is')} <strong>${q.correctValue}</strong>. ${L(q.explanation)}`;
    } else {
      yearsLost += q.yearsCost;
      fb.className = 'feedback show';
      fb.innerHTML = `<strong style="color:#dc2626;">${tt('miss_label')}</strong> ${tt('correct_answer_is')} <strong>${q.correctValue}</strong>. ${L(q.explanation)}`;
    }
    moveSnail(correct);
    document.getElementById('qe-next-btn').style.display = 'inline-block';
  }

  function renderEnd() {
    const lifeYears = Math.max(50, Math.min(100, 100 - yearsLost));
    const snailFate = correctCount >= 12 ? tt('qe.snail_win') : tt('qe.snail_lose');
    if (correctCount >= 12) snailPos = 5;
    else snailPos = 95;
    updateSnail();

    const c = document.getElementById('qe-content');
    c.innerHTML = `
      <h3 style="text-align:center; color:#78350f;">${tt('qe.result')}</h3>
      <p style="text-align:center; margin:10px 0;">${tt('qe.correct_count', {n: correctCount, total: quizE_questions.length})}</p>
      <p style="text-align:center; margin:10px 0;">${snailFate}</p>
      <div style="text-align:center; margin:20px 0;">
        <div style="font-size:0.95rem; margin-bottom:8px;">${tt('qe.reveal_prompt')}</div>
        <button id="qe-reveal-btn" class="final-life" style="cursor:pointer;">${tt('qe.reveal_initial')}</button>
        <div id="qe-life-tip" style="margin-top:12px; font-style:italic; color:#475569;"></div>
      </div>
      <div class="sources">
        <strong>${tt('sources_label')}</strong><br>
        • WHO — <a href="https://www.who.int/europe/news/item/14-03-2022-5-recommendations-to-reduce-salt-intake-to-live-longer-and-healthier-lives" target="_blank">who.int</a><br>

        • PLOS Medicine — <a href="https://journals.plos.org/plosmedicine/article?id=10.1371/journal.pmed.1002082" target="_blank">journals.plos.org</a><br>
        • DGE — <a href="https://www.dge.de" target="_blank">dge.de</a><br>
        • BZfE — <a href="https://www.bzfe.de" target="_blank">bzfe.de</a><br>
        • Verbraucherzentrale — <a href="https://www.verbraucherzentrale.de" target="_blank">verbraucherzentrale.de</a>
      </div>
      <div style="text-align:center;"><button class="nav-btn" onclick="initQuizE()">${tt('restart_btn')}</button></div>
    `;

function initQuizF() {
  const root = document.getElementById('quiz-f');
  let cloudsHTML = '';
  for (let i = 0; i < 4; i++) {
    cloudsHTML += `<span class="cloud-anim" style="left:${15 + i*22}%; top:${50 + i*8}%; animation-delay:${i*4}s;">☁️</span>`;
  }
  root.innerHTML = `
    ${cloudsHTML}
    <div class="sinking-drone">🚁</div>
    <div class="header">
      <h1>${tt('qf.title')}</h1>
      <p>${tt('qf.sub')}</p>
    </div>
    <div class="layout">
      <div class="left-panel">
        <h3>${tt('qf.your_progress')}</h3>
        <div class="progress-bar"><div class="progress-fill" id="qf-progress-fill" style="width:0%;"></div></div>
        <p id="qf-progress-text" style="text-align:center; color:#1e293b; font-weight:600;"></p>
        <div style="margin-top:14px; padding:10px; background:#e0e7ff; border-radius:8px;">
          <strong>${tt('qf.score_label')}</strong> <span id="qf-score">0</span> ${tt('qf.points_suffix')}
        </div>
      </div>
      <div class="content-card" id="qf-card">
        <div id="qf-content"></div>
      </div>
    </div>
  `;

  let current = 0;
  let score = 0;

  function render() {
    document.getElementById('qf-progress-fill').style.width = (current / quizF_questions.length * 100) + '%';
    document.getElementById('qf-progress-text').textContent = tt('qf.progress_text', {n: current, total: quizF_questions.length});
    document.getElementById('qf-score').textContent = score;
    const c = document.getElementById('qf-content');
    if (current >= quizF_questions.length) { renderEnd(); return; }
    const q = quizF_questions[current];
    let html = `<div class="question">${tt('qf.question_label', {n: current+1})} ${L(q.q)}</div>`;
    html += `<button class="hint-btn" id="qf-hint-btn">${tt('show_hint')}</button>`;
    html += `<div id="qf-hint-text" style="display:none; background:#fef3c7; padding:8px; border-radius:6px; margin-bottom:10px; color:#92400e;">${L(q.hint)}</div>`;
    if (q.type === 'mc') {
      html += `<div class="options" id="qf-options">`;
      L(q.options).forEach((opt, idx) => {
        html += `<button class="option-btn" data-idx="${idx}">${String.fromCharCode(65+idx)}) ${opt}</button>`;
      });
      html += `</div>`;
    } else {
      html += `<div class="options" id="qf-options">
        <button class="option-btn" data-idx="true">${tt('true_btn')}</button>
        <button class="option-btn" data-idx="false">${tt('false_btn')}</button>
      </div>`;
    }
    html += `<div class="feedback" id="qf-feedback"></div>`;
    html += `<div class="source-line">${tt('qf.source_label')} ${q.source}</div>`;
    html += `<button class="nav-btn" id="qf-next-btn" style="display:none;">${tt('next_btn')}</button>`;
    c.innerHTML = html;

    document.getElementById('qf-hint-btn').addEventListener('click', () => {
      document.getElementById('qf-hint-text').style.display = 'block';
      document.getElementById('qf-hint-btn').disabled = true;
      document.getElementById('qf-hint-btn').style.opacity = 0.5;
    });
    c.querySelectorAll('.option-btn').forEach(btn => btn.addEventListener('click', () => handleAnswer(btn)));
    document.getElementById('qf-next-btn').addEventListener('click', () => { current++; render(); });
  }

  function handleAnswer(btn) {
    const q = quizF_questions[current];
    const fb = document.getElementById('qf-feedback');
    let correct;
    if (q.type === 'mc') correct = parseInt(btn.dataset.idx) === q.correct;
    else correct = (btn.dataset.idx === 'true') === q.correct;

    document.querySelectorAll('#qf-options .option-btn').forEach(b => b.disabled = true);
    if (correct) {
      btn.style.background = '#bbf7d0';
      score += 1;
      fb.className = 'feedback show right';
      fb.innerHTML = `<strong>${tt('correct_label')}</strong> ${L(q.explanation)}<br><em>${tt('qf.pts_plus')}</em>`;
    } else {
      btn.style.background = '#fecaca';
      document.querySelectorAll('#qf-options .option-btn').forEach(b => {
        const matchMC = q.type === 'mc' && parseInt(b.dataset.idx) === q.correct;
        const matchTF = q.type === 'tf' && b.dataset.idx === String(q.correct);
        if (matchMC || matchTF) b.style.background = '#bbf7d0';
      });
      fb.className = 'feedback show wrong';
      fb.innerHTML = `<strong>${tt('wrong_label')}</strong> ${L(q.explanation)}<br><em>${tt('qf.pts_zero')}</em>`;
    }
    document.getElementById('qf-score').textContent = score;
    document.getElementById('qf-next-btn').style.display = 'inline-block';
  }

  function renderEnd() {
    const c = document.getElementById('qf-content');
    const max = quizF_questions.length;
    let stars;
    if (score >= 5) stars = '⭐⭐⭐';
    else if (score >= 3) stars = '⭐⭐';
    else if (score >= 1) stars = '⭐';
    else stars = '✗';

    c.innerHTML = `
      <h3 style="text-align:center; color:#1e40af;">${tt('qf.finished')}</h3>
      <p style="text-align:center; font-size:1.2rem;">${tt('you_scored', {score: score, max: max})}</p>
      <div class="stars">${stars}</div>
      <div class="sources" style="font-size:0.85rem; color:#4b5563; margin-top:18px; line-height:1.6;">
        <strong>${tt('sources_label')}</strong><br>
        • simplyscience.ch — <a href="https://www.simplyscience.ch/teens/wissen/so-fliegen-drohnen" target="_blank">simplyscience.ch</a><br>
        • drone-zone.de — <a href="https://www.drone-zone.de/wissen-propeller-fuer-drohnen-6-fragen-einfach-erklaert/" target="_blank">drone-zone.de</a><br>
        • lehrerfreund.de — <a href="https://www.lehrerfreund.de/technik/1s/drohnen-2/4785" target="_blank">lehrerfreund.de</a><br>
        • drohnen-vergleich.de — <a href="https://www.drohnen-vergleich.de/wie-funktioniert-eine-drohne/" target="_blank">drohnen-vergleich.de</a><br>
        • u-rob.com — <a href="https://u-rob.com/wissensartikel/wie-funktioniert-eine-drohne/" target="_blank">u-rob.com</a><br>
        • kgm.dk — <a href="https://www.kgm.dk" target="_blank">kgm.dk</a>
      </div>
      <div style="text-align:center;"><button class="nav-btn" onclick="initQuizF()">${tt('restart_btn')}</button></div>
    `;
  }

  render();
}

/* ========================================================
   QUIZ G — Ocean (Jolina, Ella, Emma)

function initQuizG() {
  const container = document.getElementById('quiz-g');
  let qIdx = 0;
  let percentage = 100;

  container.innerHTML = `
    <div class="content-card">
      <h2>${tt('qg.title')}</h2>
      <p style="text-align:center; color:#0e7490;">${tt('qg.sub')}</p>
      <div class="percentage-display" id="qg-pct">100%</div>
      <div id="qg-content"></div>
    </div>
  `;

  function render() {
    const c = document.getElementById('qg-content');
    if (qIdx >= quizG_questions.length) { renderEnd(); return; }
    const q = quizG_questions[qIdx];
    let optsHtml = '';
    if (q.type === 'mc') {
      optsHtml = L(q.options).map((o, i) =>
        `<button class="option-btn" data-idx="${i}" onclick="window._qgAnswer(${i})">${String.fromCharCode(65+i)}) ${o}</button>`
      ).join('');
    } else {
      optsHtml = `
        <button class="option-btn" data-idx="true" onclick="window._qgAnswer(true)">${tt('true_btn')}</button>
        <button class="option-btn" data-idx="false" onclick="window._qgAnswer(false)">${tt('false_btn')}</button>
      `;
    }
    c.innerHTML = `
      <p style="color:#0e7490; font-weight:600;">${tt('qg.question_label', {n: qIdx+1, total: quizG_questions.length, w: q.difficulty})}</p>
      <p class="question">${L(q.question)}</p>
      <button class="hint-btn" onclick="this.nextElementSibling.style.display='block'; this.style.display='none';">${tt('qg.hint_btn')}</button>
      <p style="display:none; color:#92400e; background:#fef3c7; padding:8px; border-radius:6px;">${L(q.hint)}</p>
      <div class="options" id="qg-options">${optsHtml}</div>
      <div class="feedback" id="qg-feedback"></div>
      <div style="text-align:center;">
        <button class="nav-btn" id="qg-next" style="display:none;" onclick="window._qgNext()">${tt('next_btn')}</button>
      </div>
    `;
  }

  window._qgAnswer = function(choice) {
    const q = quizG_questions[qIdx];
    document.querySelectorAll('#qg-options .option-btn').forEach(b => b.disabled = true);
    const fb = document.getElementById('qg-feedback');
    const isCorrect = (q.type === 'mc') ? (choice === q.correct) : (choice === q.correct);
    if (isCorrect) {
      percentage = Math.min(100, percentage + q.difficulty);
      document.querySelectorAll('#qg-options .option-btn').forEach(b => {
        const sel = (q.type === 'mc') ? parseInt(b.dataset.idx) === choice : b.dataset.idx === String(choice);
        if (sel) b.classList.add('correct');
      });
      fb.className = 'feedback show';
      fb.innerHTML = `<div class="smiley">😊</div><strong>${tt('correct_label')}</strong> +${q.difficulty}% · ${L(q.explanation)}`;
    } else {
      percentage = Math.max(0, percentage - q.difficulty);
      document.querySelectorAll('#qg-options .option-btn').forEach(b => {
        const sel = (q.type === 'mc') ? parseInt(b.dataset.idx) === choice : b.dataset.idx === String(choice);
        const corr = (q.type === 'mc') ? parseInt(b.dataset.idx) === q.correct : b.dataset.idx === String(q.correct);
        if (sel) b.classList.add('wrong');
        if (corr) b.classList.add('correct');
      });
      fb.className = 'feedback show';
      fb.innerHTML = `<div class="smiley">😢</div><strong>${tt('wrong_label')}</strong> −${q.difficulty}% · ${L(q.explanation)}`;
    }
    document.getElementById('qg-pct').textContent = percentage + '%';
    document.getElementById('qg-next').style.display = 'inline-block';
  };

  window._qgNext = function() { qIdx++; render(); };

  function renderEnd() {
    const c = document.getElementById('qg-content');
    c.innerHTML = `
      <h3 style="text-align:center; color:#0e7490;">${tt('qg.final')}</h3>
      <p style="text-align:center; font-size:1.4rem;">${tt('qg.final_score')} <strong>${percentage}%</strong></p>
      <div class="smiley">${percentage >= 70 ? '🎉😊🎉' : percentage >= 40 ? '🙂' : '😢'}</div>
      <div class="sources">
        <strong>${tt('sources_label')}</strong><br>
        • National Geographic — <a href="https://www.nationalgeographic.com/environment/article/oceans" target="_blank">nationalgeographic.com</a><br>
        • NOAA — <a href="https://oceanservice.noaa.gov/facts/" target="_blank">oceanservice.noaa.gov</a><br>
        • Britannica — <a href="https://www.britannica.com/science/ocean" target="_blank">britannica.com</a><br>
        • NASA Earth Observatory — <a href="https://earthobservatory.nasa.gov/" target="_blank">earthobservatory.nasa.gov</a>
      </div>
      <div style="text-align:center;"><button class="nav-btn" onclick="initQuizG()">${tt('restart_btn')}</button></div>
    `;
    if (percentage >= 50) {
      for (let i = 0; i < 80; i++) {
        const c2 = document.createElement('div');
        c2.style.cssText = `position:fixed; top:-10px; left:${Math.random()*100}vw; width:8px; height:8px; background:hsl(${Math.random()*360},80%,60%); z-index:5000; pointer-events:none; border-radius:2px; animation: fall ${2+Math.random()*2}s linear forwards;`;
        document.body.appendChild(c2);
        setTimeout(() => c2.remove(), 4000);
      }
    }
  }

  render();
}

  window._qhAnswer = function(choice) {
    const q = quizH_questions[qIdx];
    document.querySelectorAll('#qh-options .option-btn').forEach(b => b.disabled = true);
    const fb = document.getElementById('qh-feedback');
    const isCorrect = (q.type === 'mc') ? (choice === q.correct) : (choice === q.correct);
    document.querySelectorAll('#qh-options .option-btn').forEach(b => {
      const sel = (q.type === 'mc') ? parseInt(b.dataset.idx) === choice : b.dataset.idx === String(choice);
      const corr = (q.type === 'mc') ? parseInt(b.dataset.idx) === q.correct : b.dataset.idx === String(q.correct);
      if (sel && !isCorrect) b.classList.add('wrong');
      if (corr) b.classList.add('correct');
    });
    if (isCorrect) {
      score += 2;
      fb.className = 'feedback show';
      fb.innerHTML = `<strong>${tt('qh.correct_2')}</strong><br>${L(q.explanation)}`;
    } else {
      score -= 1;
      mistakes++;
      const correctText = (q.type === 'mc') ? L(q.options)[q.correct] : (q.correct ? tt('qh.yes_btn') : tt('qh.no_btn'));
      fb.className = 'feedback show';
      fb.innerHTML = `<strong>${tt('qh.wrong_minus1')}</strong><br>${tt('qh.correct_answer_prefix')} <strong>${correctText}</strong>.<br>${L(q.explanation)}`;
    }
    document.getElementById('qh-score').textContent = tt('qh.score_text', {score: score, n: qIdx+1, total: quizH_questions.length});
    document.getElementById('qh-next').style.display = 'inline-block';
  };

  window._qhNext = function() { qIdx++; render(); };

  function launchFireworks() {
    const colors = ['#d4af37', '#ff6b6b', '#4ecdc4', '#ffe66d', '#a78bfa', '#fb7185'];
    for (let i = 0; i < 60; i++) {
      setTimeout(() => {
        const f = document.createElement('div');
        f.className = 'firework';
        f.style.background = colors[Math.floor(Math.random()*colors.length)];
        f.style.left = (20 + Math.random()*60) + 'vw';
        f.style.top = (10 + Math.random()*40) + 'vh';
        f.style.boxShadow = `0 0 12px ${f.style.background}`;
        f.style.animation = `fwBurst ${1+Math.random()*0.6}s ease-out forwards`;
        document.body.appendChild(f);
        setTimeout(() => f.remove(), 2000);
      }, i * 80);
    }
  }

  function renderEnd() {
    const c = document.getElementById('qh-content');
    let greeting;
    if (mistakes <= 3) {
      greeting = `<div class="greeting-good">${tt('qh.good')}</div>`;
    } else {
      greeting = `<div class="greeting-encourage">${tt('qh.encourage')}</div>`;
    }
    c.innerHTML = `
      <h3 style="text-align:center; color:#000;">${tt('qh.final_score', {score: score})}</h3>
      <p style="text-align:center; color:#000;">${tt('qh.mistakes', {n: mistakes, total: quizH_questions.length})}</p>
      ${greeting}
      <div class="sources">
        <strong>${tt('sources_label')}</strong><br>
        • WHO — <a href="https://www.who.int/health-topics/nutrition" target="_blank">who.int</a><br>
        • NHS — <a href="https://www.nhs.uk/live-well/eat-well/" target="_blank">nhs.uk</a><br>
        • DGE — <a href="https://www.dge.de" target="_blank">dge.de</a><br>
        • BZfE — <a href="https://www.bzfe.de" target="_blank">bzfe.de</a><br>
        • Kindergesundheit-info — <a href="https://www.kindergesundheit-info.de" target="_blank">kindergesundheit-info.de</a>
      </div>
      <div style="text-align:center;"><button class="nav-btn" onclick="initQuizH()">${tt('restart_btn')}</button></div>
    `;
    if (mistakes <= 3) launchFireworks();
  }

  render();
}
