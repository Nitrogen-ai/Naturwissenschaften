<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naturwissenschaften – Quizsammlung Klasse 6</title>
<style>
/* =========================
   GLOBAL RESET & BASE
   ========================= */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: #f3f4f6; color: #1f2937; line-height: 1.5; }

button { font-family: inherit; cursor: pointer; border: none; }

/* =========================
   MENU (Hub)
   ========================= */
.menu-screen {
  min-height: 100vh;
  background: linear-gradient(135deg, #312e81 0%, #1e40af 50%, #0e7490 100%);
  padding: 40px 20px;
}
.menu-screen h1 {
  text-align: center;
  color: #fff;
  font-size: 2.4rem;
  margin-bottom: 8px;
  text-shadow: 0 4px 12px rgba(0,0,0,0.3);
}
.menu-screen .subtitle {
  text-align: center;
  color: #e0e7ff;
  font-size: 1.1rem;
  margin-bottom: 36px;
}
.menu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 18px;
  max-width: 1100px;
  margin: 0 auto;
}
.menu-card {
  background: rgba(255,255,255,0.95);
  border-radius: 14px;
  padding: 22px;
  cursor: pointer;
  transition: transform 0.18s, box-shadow 0.18s;
  box-shadow: 0 6px 18px rgba(0,0,0,0.15);
  border: none;
  text-align: left;
  width: 100%;
}
.menu-card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(0,0,0,0.25); }
.menu-card .letter {
  display: inline-block;
  background: #1e40af;
  color: #fff;
  width: 32px; height: 32px;
  border-radius: 50%;
  text-align: center;
  line-height: 32px;
  font-weight: 700;
  margin-bottom: 10px;
}
.menu-card h3 {
  font-size: 1.05rem;
  color: #111827;
  margin-bottom: 6px;
}
.menu-card .topic {
  color: #4b5563;
  font-size: 0.9rem;
}
.menu-card .authors {
  color: #6b7280;
  font-size: 0.8rem;
  margin-top: 8px;
  font-style: italic;
}

/* Back button (shared) */
.back-btn {
  position: fixed;
  top: 14px; left: 14px;
  background: rgba(0,0,0,0.55);
  color: #fff;
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 0.9rem;
  z-index: 10000;
  backdrop-filter: blur(4px);
}
.back-btn:hover { background: rgba(0,0,0,0.8); }

/* Quiz screens hidden initially */
.quiz-screen { display: none; min-height: 100vh; }
.quiz-screen.active { display: block; }

/* =========================
   A) Vogelflug — Anika & Lina
   ========================= */
#quiz-a {
  background: linear-gradient(180deg, #87ceeb 0%, #b6e0f5 100%);
  position: relative;
  overflow: hidden;
}
#quiz-a .clouds, #quiz-a .birds {
  position: absolute; inset: 0; pointer-events: none; z-index: 0;
}
#quiz-a .cloud {
  position: absolute;
  font-size: 3rem;
  opacity: 0.85;
  animation: floatCloud 30s linear infinite;
}
#quiz-a .bird {
  position: absolute;
  font-size: 1.8rem;
  animation: flyBird 18s linear infinite;
}
@keyframes floatCloud {
  0% { transform: translateX(-150px); }
  100% { transform: translateX(calc(100vw + 150px)); }
}
@keyframes flyBird {
  0%   { transform: translateX(-100px) translateY(0); }
  50%  { transform: translateX(50vw) translateY(-20px); }
  100% { transform: translateX(calc(100vw + 100px)) translateY(0); }
}
#quiz-a .content-card {
  position: relative;
  z-index: 2;
  max-width: 720px;
  margin: 60px auto;
  background: rgba(255,255,255,0.96);
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 12px 36px rgba(0,0,0,0.15);
}
#quiz-a h2 {
  color: #1e3a8a;
  text-align: center;
  margin-bottom: 6px;
}
#quiz-a .score-bar {
  text-align: center;
  font-weight: 600;
  color: #0c4a6e;
  margin-bottom: 18px;
}
#quiz-a .question { font-size: 1.15rem; margin-bottom: 14px; color: #111827; }
#quiz-a .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
#quiz-a .option-btn {
  background: #e0f2fe;
  color: #0c4a6e;
  padding: 12px 16px;
  border-radius: 10px;
  text-align: left;
  font-size: 1rem;
  border: 2px solid transparent;
  transition: all 0.15s;
}
#quiz-a .option-btn:hover:not(:disabled) { background: #bae6fd; border-color: #0284c7; }
#quiz-a .option-btn.correct { background: #bbf7d0; border-color: #16a34a; }
#quiz-a .option-btn.wrong { background: #fecaca; border-color: #dc2626; }
#quiz-a .option-btn:disabled { cursor: not-allowed; opacity: 0.85; }
#quiz-a .hint-btn { background: #fef3c7; color: #92400e; padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 10px; }
#quiz-a .feedback {
  background: #f3f4f6;
  border-left: 4px solid #0284c7;
  padding: 12px;
  margin-top: 10px;
  border-radius: 6px;
  display: none;
}
#quiz-a .feedback.show { display: block; }
#quiz-a .feedback.wrong { border-left-color: #dc2626; background: #fef2f2; }
#quiz-a .feedback.right { border-left-color: #16a34a; background: #f0fdf4; }
#quiz-a .nav-btn { background: #1e40af; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 1rem; margin-top: 10px; }
#quiz-a .nav-btn:hover { background: #1e3a8a; }
#quiz-a .trophy { font-size: 5rem; text-align: center; animation: bounce 1s infinite; }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
#quiz-a .confetti-piece {
  position: fixed;
  width: 10px; height: 14px;
  top: -20px;
  z-index: 5000;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  to { transform: translateY(110vh) rotate(720deg); }
}
#quiz-a .sources { font-size: 0.85rem; color: #4b5563; margin-top: 18px; line-height: 1.6; }
#quiz-a .sources a { color: #1e40af; word-break: break-all; }

/* =========================

#quiz-b .question-counter {

#quiz-b .estimate-input {

#quiz-b .sources { font-size: 0.85rem; color: #4b5563; margin-top: 18px; line-height: 1.6; }
#quiz-b .sources a { color: #78350f; word-break: break-all; }

/* =========================
   D) Kolibri — Mathilda & Helene
   ========================= */
#quiz-d {

   ========================= */

}

}
#quiz-e .option-btn:hover:not(:disabled) { background: #fde68a; }
#quiz-e .option-btn.correct { background: #bbf7d0; border-color: #16a34a; }
#quiz-e .option-btn.wrong { background: #fecaca; border-color: #dc2626; }

}

/* =========================
   F) Drones (English) — Section F
   ========================= */
#quiz-f {
  background: linear-gradient(180deg, #3b82f6 0%, #60a5fa 50%, #93c5fd 100%);
  min-height: 100vh;
  padding: 30px 20px;
  position: relative;
  overflow: hidden;
}
#quiz-f .cloud-anim {
  position: absolute;
  font-size: 3rem;
  opacity: 0.7;
  animation: cloudFadeUp 18s linear infinite;
}
@keyframes cloudFadeUp {
  0% { transform: translateY(0); opacity: 0.7; }
  100% { transform: translateY(-300px); opacity: 0; }
}
#quiz-f .sinking-drone {
  position: absolute;
  font-size: 4rem;
  left: 50%;

  animation: droneSink 8s ease-in-out infinite alternate;
  z-index: 1;
}
@keyframes droneSink {
  0% { top: 80px; }
  100% { top: calc(100vh - 200px); }
}

/* ========================================================
   QUIZ A — Vogelflug (Anika & Lina)
   ======================================================== */
const quizA_questions = [
  {
    type: 'mc',
    q: 'Wie funktioniert der Vogelflug im Wesentlichen?',
    options: [
      'Vögel atmen Luft ein und werden dadurch leichter, so dass sie aufsteigen.',
      'Die besondere Form des Flügels erzeugt einen Auftrieb, der den Vogel in der Luft hält.',
      'Vögel haben hohle Knochen, die sie schweben lassen, ohne dass die Flügel etwas tun.',
      'Sie nutzen Magnetfelder der Erde, um sich abzustoßen.'
    ],
    correct: 1,
    hint: 'Schau dir die Form eines Vogelflügels an: oben gewölbt, unten flacher.',
    explanation: 'Richtig ist B: Der Vogelflügel ist oben stärker gewölbt als unten. Dadurch strömt die Luft oben schneller, es entsteht ein Unterdruck und der Flügel wird nach oben gezogen — das nennt man Auftrieb.'
  },
  {
    type: 'mc',
    q: 'Welches physikalische Prinzip steckt hauptsächlich hinter dem Vogelflug?',
    options: [
      'Der Archimedes-Auftrieb (wie bei Schiffen im Wasser)',
      'Das Bernoulli-Prinzip (Luftgeschwindigkeit erzeugt Druckunterschied)',
      'Das Trägheitsprinzip von Galilei',
      'Die Schwerkraft nach Newton'
    ],
    correct: 1,
    hint: 'Es geht um Luftströmung und Druckunterschiede zwischen Ober- und Unterseite des Flügels.',
    explanation: 'Richtig ist B: Nach dem Bernoulli-Prinzip strömt Luft schneller über die gewölbte Flügeloberseite. Schnellere Luft = niedrigerer Druck. Der höhere Druck unten drückt den Flügel nach oben. Zusätzlich wirkt auch Newtons drittes Gesetz (Luft wird nach unten abgelenkt).'
  },
  {
    type: 'tf',
    q: 'Ein Kolibri kann auf der Stelle fliegen und sogar rückwärts.',
    correct: true,
    explanation: 'Richtig! Kolibris schlagen ihre Flügel bis zu 80-mal pro Sekunde und können dadurch in der Luft stehenbleiben, vorwärts, rückwärts und seitwärts fliegen.'
  },
  {
    type: 'mc',
    q: 'Welche Flugart nutzen Vögel, wenn sie Aufwinde zum Höhengewinn ausnutzen?',
    options: [
      'Ruderflug',
      'Segelflug',
      'Sturzflug',
      'Rüttelflug'
    ],
    correct: 1,
    hint: 'Das Wort hat etwas mit Wind zu tun, der den Vogel nach oben trägt.',
    explanation: 'Richtig ist B: Beim Segelflug nutzen Vögel Aufwinde, die zum Beispiel an Berghängen oder Waldrändern entstehen. Greifvögel wie Adler kreisen so über große Strecken, ohne mit den Flügeln zu schlagen.'
  },
  {
    type: 'tf',
    q: 'Vögel haben massive, schwere Knochen, damit sie beim Fliegen stabil bleiben.',
    correct: false,
    explanation: 'Falsch! Vögel haben hohle (pneumatische) Knochen, die sehr leicht sind. So wird das Gesamtgewicht reduziert, das die Flügel anheben müssen. Ohne diese Leichtbauweise wäre Fliegen kaum möglich.'
  },
  {
    type: 'mc',
    q: 'Wofür braucht ein Vogel die Schwungfedern an den Flügelenden?',
    options: [
      'Nur zur Tarnung gegen Feinde',
      'Sie erzeugen Vortrieb und Auftrieb beim Flügelschlag',
      'Zum Wärmen der Eier',
      'Damit der Vogel im Wasser schwimmen kann'
    ],
    correct: 1,
    hint: 'Es geht um Antrieb und Bewegung in der Luft.',
    explanation: 'Richtig ist B: Die großen Schwungfedern sind so geformt, dass sie beim Abschlag Luft nach hinten unten drücken. Das erzeugt sowohl Auftrieb (nach oben) als auch Vortrieb (nach vorn) — der Vogel kommt voran.'
  },
  {
    type: 'tf',
    q: 'Flugzeugflügel sind nach einem ähnlichen Prinzip geformt wie Vogelflügel.',
    correct: true,
    explanation: 'Richtig! Auch Flugzeugtragflächen sind oben stärker gewölbt als unten. Sie nutzen denselben Effekt zur Auftriebserzeugung wie der Vogelflügel — die Natur hat es zuerst „erfunden".'
  }
];

function initQuizA() {
  const root = document.getElementById('quiz-a');
  // Build cloud / bird decorations
  let bgHTML = '<div class="clouds">';
  for (let i = 0; i < 5; i++) {
    bgHTML += `<span class="cloud" style="top:${10 + i*15}%; left:${-10 - i*20}%; animation-delay:${i*3}s; font-size:${2.5 + i*0.4}rem;">☁️</span>`;
  }
  bgHTML += '</div><div class="birds">';
  for (let i = 0; i < 4; i++) {
    bgHTML += `<span class="bird" style="top:${20 + i*18}%; animation-delay:${i*4}s;">🕊️</span>`;
  }
  bgHTML += '</div>';

  root.innerHTML = bgHTML + `
    <div class="content-card">
      <h2>🐦 Quiz: Vogelflug</h2>
      <p style="text-align:center; color:#475569; font-size:0.9rem;">von Anika & Lina · 7 Fragen · 2 Punkte pro Aufgabe</p>
      <div class="score-bar" id="qa-score-bar">Frage 1 von 7 · Punkte: 0</div>
      <div id="qa-content"></div>
    </div>
  `;

  let current = 0;
  let score = 0;
  let answered = false;

  function render() {
    answered = false;
    const c = document.getElementById('qa-content');
    document.getElementById('qa-score-bar').textContent = `Frage ${current+1} von ${quizA_questions.length} · Punkte: ${score}`;

    if (current >= quizA_questions.length) { renderEnd(); return; }
    const q = quizA_questions[current];
    let html = `<div class="question">${current+1}. ${q.q}</div>`;
    if (q.type === 'mc') {
      html += `<button class="hint-btn" id="qa-hint-btn">💡 Tipp anzeigen</button>`;
      html += `<div id="qa-hint-text" style="display:none; background:#fef3c7; padding:8px; border-radius:6px; margin-bottom:10px; color:#92400e;">${q.hint}</div>`;
      html += `<div class="options">`;
      q.options.forEach((opt, idx) => {
        html += `<button class="option-btn" data-idx="${idx}">${String.fromCharCode(65+idx)}) ${opt}</button>`;
      });
      html += `</div>`;
    } else {
      html += `<div class="options">
        <button class="option-btn" data-idx="true">✓ Wahr</button>
        <button class="option-btn" data-idx="false">✗ Falsch</button>
      </div>`;
    }
    html += `<div class="feedback" id="qa-feedback"></div>`;
    html += `<button class="nav-btn" id="qa-next-btn" style="display:none;">Weiter →</button>`;
    c.innerHTML = html;

    if (q.type === 'mc') {
      document.getElementById('qa-hint-btn').addEventListener('click', () => {
        document.getElementById('qa-hint-text').style.display = 'block';
        document.getElementById('qa-hint-btn').disabled = true;
        document.getElementById('qa-hint-btn').style.opacity = 0.5;
      });
    }
    c.querySelectorAll('.option-btn').forEach(btn => {
      btn.addEventListener('click', () => handleAnswer(btn));
    });
    document.getElementById('qa-next-btn').addEventListener('click', () => { current++; render(); });
  }

  function handleAnswer(btn) {
    if (answered) return;
    answered = true;
    const q = quizA_questions[current];
    const fb = document.getElementById('qa-feedback');
    document.querySelectorAll('#qa-content .option-btn').forEach(b => b.disabled = true);

    let correct = false;
    if (q.type === 'mc') {
      const idx = parseInt(btn.dataset.idx);
      correct = idx === q.correct;
      document.querySelectorAll('#qa-content .option-btn')[q.correct].classList.add('correct');
      if (!correct) btn.classList.add('wrong');
    } else {
      const val = btn.dataset.idx === 'true';
      correct = val === q.correct;
      if (correct) btn.classList.add('correct');
      else {
        btn.classList.add('wrong');
        document.querySelectorAll('#qa-content .option-btn').forEach(b => {
          if (b.dataset.idx === String(q.correct)) b.classList.add('correct');
        });
      }
    }

    if (correct) {
      score += 2;
      fb.className = 'feedback show right';
      fb.innerHTML = `<strong>✓ Richtig!</strong> ${q.explanation}<br><em>+2 Punkte</em>`;
    } else {
      score -= 1;
      fb.className = 'feedback show wrong';
      fb.innerHTML = `<strong>✗ Falsch.</strong> ${q.explanation}<br><em>−1 Punkt</em>`;
    }
    document.getElementById('qa-score-bar').textContent = `Frage ${current+1} von ${quizA_questions.length} · Punkte: ${score}`;
    document.getElementById('qa-next-btn').style.display = 'inline-block';
  }

  function renderEnd() {
    const c = document.getElementById('qa-content');
    const maxScore = quizA_questions.length * 2;
    let html = `<h3 style="text-align:center; color:#1e3a8a;">Quiz beendet!</h3>`;
    html += `<p style="text-align:center; font-size:1.3rem; margin:14px 0;">Du hast <strong>${score}</strong> von ${maxScore} Punkten erreicht.</p>`;
    if (score >= 12) {
      html += `<div class="trophy">🏆</div>`;
      html += `<p style="text-align:center; color:#16a34a; font-weight:700; font-size:1.2rem;">Hervorragend! Du bist ein Vogelflug-Profi!</p>`;
      launchConfettiA();
    } else {

function initQuizB() {
  const root = document.getElementById('quiz-b');
  root.innerHTML = `
    <div class="table-card">
      <h2>🍽️ Quiz: Essen & Trinken</h2>
      <p style="text-align:center; color:#92400e; font-size:0.9rem;">von Emil & Oscar · 10 Fragen</p>
      <div class="food-decorations">
        <span>🍎</span><span>🥕</span><span>🍞</span><span>🥛</span>
      </div>
      <div id="qb-content"></div>
    </div>
    <div class="question-counter" id="qb-counter">Frage 1 / 10</div>
  `;

  let current = 0;
  let attempts = 0;
  let score = 0;

  function render() {
    attempts = 0;
    document.getElementById('qb-counter').textContent = `Frage ${current+1} / ${quizB_questions.length}`;
    const c = document.getElementById('qb-content');
    if (current >= quizB_questions.length) { renderEnd(); return; }
    const q = quizB_questions[current];
    let html = `<div class="question">${q.q}</div>`;
    if (q.type === 'mc') {
      html += `<div class="options" id="qb-options">`;
      q.options.forEach((opt, idx) => {
        html += `<button class="option-btn" data-idx="${idx}">${opt}</button>`;
      });
      html += `</div>`;
    } else if (q.type === 'estimate') {
      html += `<input type="number" step="any" class="estimate-input" id="qb-estimate" placeholder="Deine Schätzung in ${q.unit}">`;
      html += `<button class="nav-btn" id="qb-submit-est">Antwort prüfen</button>`;
    }
    html += `<div class="feedback" id="qb-feedback"></div>`;
    html += `<button class="nav-btn" id="qb-next-btn" style="display:none;">Weiter →</button>`;
    c.innerHTML = html;

    document.getElementById('qb-next-btn').addEventListener('click', () => { current++; render(); });
    if (q.type === 'mc') {
      c.querySelectorAll('.option-btn').forEach(btn => btn.addEventListener('click', () => handleMC(btn)));
    } else {
      document.getElementById('qb-submit-est').addEventListener('click', handleEstimate);
    }
  }

  function handleMC(btn) {
    const q = quizB_questions[current];
    const idx = parseInt(btn.dataset.idx);
    const fb = document.getElementById('qb-feedback');

    if (idx === q.correct) {
      btn.classList.add('correct');
      document.querySelectorAll('#qb-options .option-btn').forEach(b => b.disabled = true);
      let pts = attempts === 0 ? 2 : (attempts === 1 ? 1 : 0);
      score += pts;
      fb.className = 'feedback show good';
      fb.innerHTML = `<strong>✓ Richtig!</strong> ${q.explanation}<br><em>+${pts} Punkt(e)</em>`;
      document.getElementById('qb-next-btn').style.display = 'inline-block';
    } else {
      // Wrong: hide this option
      btn.classList.add('hidden-wrong');
      btn.disabled = true;
      attempts++;
      if (attempts === 1) {
        fb.className = 'feedback show';
        fb.innerHTML = `<strong>✗ Leider falsch.</strong> <strong>Tipp:</strong> ${q.hint}`;
      } else {
        fb.className = 'feedback show';
        fb.innerHTML = `<strong>✗ Auch nicht richtig.</strong> <strong>Erklärung:</strong> ${q.explanation}`;
      }
    }
  }

  function handleEstimate() {
    const q = quizB_questions[current];
    const val = parseFloat(document.getElementById('qb-estimate').value);
    const fb = document.getElementById('qb-feedback');
    if (isNaN(val)) { fb.className = 'feedback show'; fb.innerHTML = 'Bitte eine Zahl eingeben.'; return; }

    if (Math.abs(val - q.correctValue) <= q.tolerance) {
      let pts = attempts === 0 ? 2 : 1;
      score += pts;
      fb.className = 'feedback show good';
      fb.innerHTML = `<strong>✓ Gut geschätzt!</strong> Die richtige Antwort: ca. ${q.correctValue} ${q.unit}.<br>${q.explanation}<br><em>+${pts} Punkt(e)</em>`;
      document.getElementById('qb-submit-est').disabled = true;
      document.getElementById('qb-estimate').disabled = true;
      document.getElementById('qb-next-btn').style.display = 'inline-block';
    } else {
      attempts++;
      if (attempts === 1) {
        fb.className = 'feedback show';
        fb.innerHTML = `<strong>✗ Knapp daneben.</strong> <strong>Tipp:</strong> ${q.hint} Versuche es nochmal!`;
      } else {
        fb.className = 'feedback show';
        fb.innerHTML = `<strong>✗ Falsch.</strong> Die richtige Antwort: ca. <strong>${q.correctValue} ${q.unit}</strong>.<br>${q.explanation}`;
        document.getElementById('qb-submit-est').disabled = true;
        document.getElementById('qb-estimate').disabled = true;
        document.getElementById('qb-next-btn').style.display = 'inline-block';
      }
    }
  }

  function renderEnd() {
    const c = document.getElementById('qb-content');
    const max = quizB_questions.length * 2;
    const pct = score / max;
    let grade;
    if (pct >= 0.92) grade = '1';
    else if (pct >= 0.81) grade = '2';
    else if (pct >= 0.67) grade = '3';
    else if (pct >= 0.50) grade = '4';
    else if (pct >= 0.30) grade = '5';
    else grade = '6';

    c.innerHTML = `
      <h3 style="text-align:center; color:#78350f;">Quiz beendet! 🎉</h3>
      <p style="text-align:center; font-size:1.2rem; margin:14px 0;">Du hast <strong>${score}</strong> von ${max} Punkten erreicht.</p>
      <div style="text-align:center;">Deine Schulnote:</div>
      <div class="grade-display">${grade}</div>
      <div class="sources">
        <strong>Quellen:</strong><br>
        • Bundeszentrum für Ernährung (BZfE): „Empfehlungen für Kinder" — <a href="https://www.bzfe.de" target="_blank">bzfe.de</a><br>
        • DGE (Deutsche Gesellschaft für Ernährung): „Referenzwerte" — <a href="https://www.dge.de/wissenschaft/referenzwerte/" target="_blank">dge.de/wissenschaft/referenzwerte</a><br>
        • Bundeszentrale für gesundheitliche Aufklärung (BZgA): „Essstörungen" — <a href="https://www.bzga-essstoerungen.de" target="_blank">bzga-essstoerungen.de</a><br>
        • WHO: „Healthy diet" — <a href="https://www.who.int/news-room/fact-sheets/detail/healthy-diet" target="_blank">who.int</a><br>
        • Kindergesundheit-info (BZgA): „Ernährung" — <a href="https://www.kindergesundheit-info.de" target="_blank">kindergesundheit-info.de</a>
      </div>
      <div style="text-align:center;"><button class="nav-btn" onclick="initQuizB()">Quiz neu starten</button></div>
    `;
  }

  render();
}

function initQuizE() {
  const root = document.getElementById('quiz-e');
  root.innerHTML = `
    <div class="snail-track">
      <span class="salad">🥗</span>
      <span class="snail" id="qe-snail" style="left:50%; transform:translate(-50%,-50%);">🐌</span>
      <span class="burger">🍔</span>
    </div>
    <div class="content-card">
      <h2>🐌 Quiz: Ernährung & Lebenszeit</h2>
      <p style="text-align:center; color:#92400e; font-size:0.9rem;">von Enna, Marek & Mattis · 15 Fragen</p>
      <div class="progress-info" id="qe-progress">Frage 1 / 15</div>
      <div id="qe-content"></div>
    </div>
  `;

  let current = 0;
  let correctCount = 0;
  let yearsLost = 0;
  let answered = false;
  let snailPos = 50; // percentage

  function updateSnail() {
    const snail = document.getElementById('qe-snail');
    if (snail) snail.style.left = snailPos + '%';
  }

  function render() {
    answered = false;
    document.getElementById('qe-progress').textContent = `Frage ${current+1} / ${quizE_questions.length}`;
    const c = document.getElementById('qe-content');
    if (current >= quizE_questions.length) { renderEnd(); return; }
    const q = quizE_questions[current];
    let html = `<div class="question">${current+1}. ${q.q}</div>`;
    if (q.type === 'mc') {
      html += `<div class="options" id="qe-options">`;
      q.options.forEach((opt, idx) => {
        html += `<button class="option-btn" data-idx="${idx}">${String.fromCharCode(65+idx)}) ${opt}</button>`;
      });
      html += `</div>`;
    } else if (q.type === 'tf') {
      html += `<div class="options" id="qe-options">
        <button class="option-btn" data-idx="true">✓ Ja / Wahr</button>
        <button class="option-btn" data-idx="false">✗ Nein / Falsch</button>
      </div>`;
    } else if (q.type === 'slider') {
      html += `
        <div class="slider-container">
          <div class="slider-track">
            <input type="range" min="${q.min}" max="${q.max}" step="${q.step}" value="${(q.min+q.max)/2}" class="slider-input" id="qe-slider">
            <div class="slider-emoji" id="qe-slider-emoji" style="left: 50%;">${q.emoji}</div>
          </div>
          <div class="slider-value" id="qe-slider-val">${(q.min+q.max)/2}</div>
          <button class="nav-btn" id="qe-slider-submit">Antwort abgeben</button>
        </div>
      `;
    }
    html += `<div class="feedback" id="qe-feedback"></div>`;
    html += `<button class="nav-btn" id="qe-next-btn" style="display:none;">Weiter →</button>`;
    c.innerHTML = html;

    if (q.type === 'mc' || q.type === 'tf') {
      c.querySelectorAll('.option-btn').forEach(btn => btn.addEventListener('click', () => handleAnswer(btn)));
    } else if (q.type === 'slider') {
      const slider = document.getElementById('qe-slider');
      slider.addEventListener('input', () => {
        const pct = (slider.value - q.min) / (q.max - q.min) * 100;
        document.getElementById('qe-slider-emoji').style.left = pct + '%';
        document.getElementById('qe-slider-val').textContent = slider.value;
      });
      document.getElementById('qe-slider-submit').addEventListener('click', handleSlider);
    }
    document.getElementById('qe-next-btn').addEventListener('click', () => { current++; render(); });
  }

  function moveSnail(correct) {
    // Each question: 50/15 = ~3.3% step
    const step = 50 / quizE_questions.length;
    if (correct) snailPos -= step; // towards salad (left)
    else snailPos += step; // towards burger (right)
    snailPos = Math.max(5, Math.min(95, snailPos));
    updateSnail();
  }

  function handleAnswer(btn) {
    if (answered) return;
    answered = true;
    const q = quizE_questions[current];
    const fb = document.getElementById('qe-feedback');
    let correct;
    if (q.type === 'mc') correct = parseInt(btn.dataset.idx) === q.correct;
    else correct = (btn.dataset.idx === 'true') === q.correct;

    document.querySelectorAll('#qe-options .option-btn').forEach(b => b.disabled = true);

    if (correct) {
      btn.classList.add('correct');
      correctCount++;
      fb.className = 'feedback show';
      fb.innerHTML = `<strong style="color:#16a34a;">✓ Richtig!</strong> ${q.explanation}`;
    } else {
      btn.classList.add('wrong');
      yearsLost += q.yearsCost;
      // Highlight correct
      document.querySelectorAll('#qe-options .option-btn').forEach(b => {
        const matchMC = q.type === 'mc' && parseInt(b.dataset.idx) === q.correct;
        const matchTF = q.type === 'tf' && b.dataset.idx === String(q.correct);
        if (matchMC || matchTF) b.classList.add('correct');
      });
      fb.className = 'feedback show';
      fb.innerHTML = `<strong style="color:#dc2626;">✗ Falsch.</strong> ${q.explanation}`;
    }
    moveSnail(correct);
    document.getElementById('qe-next-btn').style.display = 'inline-block';
  }

  function handleSlider() {
    if (answered) return;
    answered = true;
    const q = quizE_questions[current];
    const val = parseFloat(document.getElementById('qe-slider').value);
    const fb = document.getElementById('qe-feedback');
    document.getElementById('qe-slider').disabled = true;
    document.getElementById('qe-slider-submit').disabled = true;

    const correct = Math.abs(val - q.correctValue) <= q.tolerance;
    if (correct) {
      correctCount++;
      fb.className = 'feedback show';
      fb.innerHTML = `<strong style="color:#16a34a;">✓ Gute Schätzung!</strong> Die richtige Antwort: <strong>${q.correctValue}</strong>. ${q.explanation}`;
    } else {
      yearsLost += q.yearsCost;
      fb.className = 'feedback show';
      fb.innerHTML = `<strong style="color:#dc2626;">✗ Daneben.</strong> Die richtige Antwort: <strong>${q.correctValue}</strong>. ${q.explanation}`;
    }
    moveSnail(correct);
    document.getElementById('qe-next-btn').style.display = 'inline-block';
  }

  function renderEnd() {
    const lifeYears = Math.max(50, Math.min(100, 100 - yearsLost));
    const snailFate = correctCount >= 12 ? '🐌🥗 Die Schnecke hat den Salat erreicht — sie lebt gesund weiter!' : '💀 Oh nein, die Schnecke hat es nicht geschafft…';
    if (correctCount >= 12) snailPos = 5;
    else snailPos = 95;
    updateSnail();

    const c = document.getElementById('qe-content');
    c.innerHTML = `
      <h3 style="text-align:center; color:#78350f;">Ergebnis</h3>
      <p style="text-align:center; margin:10px 0;">Richtig: <strong>${correctCount}</strong> / ${quizE_questions.length}</p>
      <p style="text-align:center; margin:10px 0;">${snailFate}</p>
      <div style="text-align:center; margin:20px 0;">
        <div style="font-size:0.95rem; margin-bottom:8px;">Tippe auf den Button für deine Lebenserwartung:</div>
        <button id="qe-reveal-btn" class="final-life" style="cursor:pointer;">?? Jahre</button>
        <div id="qe-life-tip" style="margin-top:12px; font-style:italic; color:#475569;"></div>
      </div>
      <div class="sources">
        <strong>Quellen:</strong><br>
        • WHO (Salt recommendation) — <a href="https://www.who.int/europe/news/item/14-03-2022-5-recommendations-to-reduce-salt-intake-to-live-longer-and-healthier-lives" target="_blank">who.int</a><br>
        • European Heart Journal: „Adding salt to food and life expectancy" — <a href="https://www.tctmd.com/news/regularly-adding-salt-food-may-shorten-life-span" target="_blank">tctmd.com</a><br>
        • PLOS Medicine: „Unhealthy behaviours and life expectancy" — <a href="https://journals.plos.org/plosmedicine/article?id=10.1371/journal.pmed.1002082" target="_blank">journals.plos.org</a><br>
        • DGE (5 am Tag) — <a href="https://www.dge.de" target="_blank">dge.de</a><br>
        • BZfE (Bundeszentrum für Ernährung) — <a href="https://www.bzfe.de" target="_blank">bzfe.de</a><br>
        • Verbraucherzentrale: „Giftige Lebensmittel" — <a href="https://www.verbraucherzentrale.de" target="_blank">verbraucherzentrale.de</a>
      </div>
      <div style="text-align:center;"><button class="nav-btn" onclick="initQuizE()">Quiz neu starten</button></div>
    `;

    document.getElementById('qe-reveal-btn').addEventListener('click', () => {
      const btn = document.getElementById('qe-reveal-btn');
      btn.textContent = lifeYears + ' Jahre';
      setTimeout(() => {
        if (lifeYears >= 80) {
          btn.classList.add('green');
          document.getElementById('qe-life-tip').textContent = '🎉 Glückwunsch! Mit deinen Antworten würdest du lange und gesund leben.';
        } else {
          btn.classList.add('red');
          document.getElementById('qe-life-tip').textContent = `💡 Tipp: Achte auf weniger Salz/Zucker, mehr Obst & Gemüse, viel Wasser und tägliche Bewegung — so kannst du mehrere Jahre dazugewinnen!`;

      }, 3000);
    });

  render();

function initQuizF() {

    cloudsHTML += `<span class="cloud-anim" style="left:${15 + i*22}%; top:${50 + i*8}%; animation-delay:${i*4}s;">☁️</span>`;
  }

    ${cloudsHTML}
    <div class="sinking-drone">🚁</div>
    <div class="header">
      <h1>🚁 Drone Quiz</h1>
      <p>How do drones fly?</p>

    <div class="layout">
      <div class="left-panel">
        <h3>Your progress</h3>
        <div class="progress-bar"><div class="progress-fill" id="qf-progress-fill" style="width:0%;"></div></div>
        <p id="qf-progress-text" style="text-align:center; color:#1e293b; font-weight:600;">0 / 6 questions</p>
        <div style="margin-top:14px; padding:10px; background:#e0e7ff; border-radius:8px;">
          <strong>Score:</strong> <span id="qf-score">0</span> points
        </div>
      </div>
      <div class="content-card" id="qf-card">
        <div id="qf-content"></div>
      </div>
    </div>
  `;

  let current = 0;
  let score = 0;
  let attempts = 0;

  function render() {
    attempts = 0;
    document.getElementById('qf-progress-fill').style.width = (current / quizF_questions.length * 100) + '%';
    document.getElementById('qf-progress-text').textContent = `${current} / ${quizF_questions.length} questions`;
    document.getElementById('qf-score').textContent = score;
    const c = document.getElementById('qf-content');
    if (current >= quizF_questions.length) { renderEnd(); return; }
    const q = quizF_questions[current];
    let html = `<div class="question">Question ${current+1}: ${q.q}</div>`;
    if (q.type === 'mc') {
      html += `<button class="hint-btn" id="qf-hint-btn">💡 Show hint</button>`;
      html += `<div id="qf-hint-text" style="display:none; background:#fef3c7; padding:8px; border-radius:6px; margin-bottom:10px; color:#92400e;">${q.hint}</div>`;
      html += `<div class="options" id="qf-options">`;
      q.options.forEach((opt, idx) => {
        html += `<button class="option-btn" data-idx="${idx}">${String.fromCharCode(65+idx)}) ${opt}</button>`;
      });
      html += `</div>`;
    } else {
      html += `<button class="hint-btn" id="qf-hint-btn">💡 Show hint</button>`;
      html += `<div id="qf-hint-text" style="display:none; background:#fef3c7; padding:8px; border-radius:6px; margin-bottom:10px; color:#92400e;">${q.hint}</div>`;
      html += `<div class="options" id="qf-options">
        <button class="option-btn" data-idx="true">✓ True</button>
        <button class="option-btn" data-idx="false">✗ False</button>
      </div>`;
    }
    html += `<div class="feedback" id="qf-feedback"></div>`;
    html += `<div class="source-line">Source: ${q.source}</div>`;
    html += `<button class="nav-btn" id="qf-next-btn" style="display:none;">Next →</button>`;
    c.innerHTML = html;

    document.getElementById('qf-hint-btn').addEventListener('click', () => {
      document.getElementById('qf-hint-text').style.display = 'block';
      document.getElementById('qf-hint-btn').disabled = true;
      document.getElementById('qf-hint-btn').style.opacity = 0.5;
    });
    c.querySelectorAll('.option-btn').forEach(btn => btn.addEventListener('click', () => handleAnswer(btn)));
    document.getElementById('qf-next-btn').addEventListener('click', () => { current++; render(); });
  }

  function handleAnswer(btn) {
    const q = quizF_questions[current];
    const fb = document.getElementById('qf-feedback');
    let correct;
    if (q.type === 'mc') correct = parseInt(btn.dataset.idx) === q.correct;
    else correct = (btn.dataset.idx === 'true') === q.correct;

    document.querySelectorAll('#qf-options .option-btn').forEach(b => b.disabled = true);
    if (correct) {
      btn.style.background = '#bbf7d0';
      score += 1;
      fb.className = 'feedback show right';
      fb.innerHTML = `<strong>✓ Correct!</strong> ${q.explanation}<br><em>+1 point</em>`;
    } else {
      btn.style.background = '#fecaca';
      // Highlight correct answer
      document.querySelectorAll('#qf-options .option-btn').forEach(b => {
        const matchMC = q.type === 'mc' && parseInt(b.dataset.idx) === q.correct;
        const matchTF = q.type === 'tf' && b.dataset.idx === String(q.correct);
        if (matchMC || matchTF) b.style.background = '#bbf7d0';
      });
      fb.className = 'feedback show wrong';
      fb.innerHTML = `<strong>✗ Wrong.</strong> ${q.explanation}<br><em>0 points</em>`;
    }
    document.getElementById('qf-score').textContent = score;
    document.getElementById('qf-next-btn').style.display = 'inline-block';
  }

  function renderEnd() {
    const c = document.getElementById('qf-content');
    const max = quizF_questions.length;
    // Stars: 1-3 stars based on score (max 6 questions)
    let stars;
    if (score >= 5) stars = '⭐⭐⭐';
    else if (score >= 3) stars = '⭐⭐';
    else if (score >= 1) stars = '⭐';
    else stars = '✗';

    c.innerHTML = `
      <h3 style="text-align:center; color:#1e40af;">Quiz finished! 🎉</h3>
      <p style="text-align:center; font-size:1.2rem;">You scored <strong>${score}</strong> out of ${max} points.</p>
      <div class="stars">${stars}</div>
      <div class="sources" style="font-size:0.85rem; color:#4b5563; margin-top:18px; line-height:1.6;">
        <strong>All sources:</strong><br>
        • simplyscience.ch — <a href="https://www.simplyscience.ch/teens/wissen/so-fliegen-drohnen" target="_blank">simplyscience.ch</a><br>
        • drone-zone.de — <a href="https://www.drone-zone.de/wissen-propeller-fuer-drohnen-6-fragen-einfach-erklaert/" target="_blank">drone-zone.de</a><br>
        • lehrerfreund.de — <a href="https://www.lehrerfreund.de/technik/1s/drohnen-2/4785" target="_blank">lehrerfreund.de</a><br>
        • kgm.dk — <a href="https://kgm.dk/de/artikel/technologie/droner/wie-funktioniert-eine-drohne" target="_blank">kgm.dk</a><br>
        • u-rob.com — <a href="https://u-rob.com/wissensartikel/wie-funktioniert-eine-drohne/" target="_blank">u-rob.com</a><br>
        • drohnen-vergleich.de — <a href="https://www.drohnen-vergleich.de/wie-funktioniert-eine-drohne/" target="_blank">drohnen-vergleich.de</a>
      </div>
      <div style="text-align:center;"><button class="nav-btn" onclick="initQuizF()">Restart quiz</button></div>
    `;
    document.getElementById('qf-progress-fill').style.width = '100%';
    document.getElementById('qf-progress-text').textContent = `${max} / ${max} questions`;
  }

  render();
}

        • German Nutrition Society (DGE) — <a href="https://www.dge.de" target="_blank">dge.de</a><br>
        • BZfE — <a href="https://www.bzfe.de" target="_blank">bzfe.de</a><br>
        • Kindergesundheit-info — <a href="https://www.kindergesundheit-info.de" target="_blank">kindergesundheit-info.de</a>
      </div>
      <div style="text-align:center;"><button class="nav-btn" onclick="initQuizH()">Restart</button></div>
    `;
    if (mistakes <= 3) launchFireworks();
  }

  render();
}

/* ========================================================
   QUIZ I — Sport vs. Normal Nutrition — Carl T, Carl K, Kai
   ======================================================== */
function initQuizI() {
  const container = document.getElementById('quiz-i');
  const questions = [
    {
      type: 'mc',
      question: 'Who generally needs MORE calories per day?',
      options: ['A child sitting at a desk all day', 'A child doing 2 hours of football training', 'They need exactly the same'],
      correct: 1,
      explanation: 'A sporty person burns more energy through movement, so they need more calories to refuel.'
    },
    {
      type: 'mc',
      question: 'What is the most important fuel for endurance sports like running or cycling?',
      options: ['Fat', 'Carbohydrates (pasta, rice, bread)', 'Protein', 'Sugar drinks only'],
      correct: 1,
      explanation: 'Carbohydrates are stored in muscles as glycogen — the body\'s favourite fast fuel for endurance.'
    },
    {
      type: 'tf',
      question: 'Athletes need to drink more water than non-athletes.',
      correct: true,
      explanation: 'True. Sport makes you sweat, so athletes lose more fluid and need to drink more to stay hydrated.'
    },
    {
      type: 'mc',
      question: 'Why do athletes eat protein (meat, eggs, beans, dairy)?',
      options: ['To make their hair longer', 'To build and repair muscles', 'To replace water', 'Only for taste'],
      correct: 1,
      explanation: 'Protein provides the building blocks (amino acids) that muscles need to grow stronger after training.'
    },
    {
      type: 'mc',
      question: 'About how many calories does an average 11–12 year old child need per day?',
      options: ['About 800 kcal', 'About 2000 kcal', 'About 4000 kcal'],
      correct: 1,
      explanation: 'An average child of this age needs around 2000 kcal per day. Very sporty children may need 300–500 kcal more.'
    },
    {
      type: 'tf',
      question: 'Eating sweets right before a football match is the best way to get energy.',
      correct: false,
      explanation: 'False. Sweets give a quick sugar spike followed by a crash. A meal with carbs (e.g. pasta) 2–3 hours before is much better.'
    },
    {
      type: 'mc',
      question: 'What is a good pre-training snack about 1 hour before sport?',
      options: ['A burger with fries', 'A banana or a slice of bread with honey', 'A big glass of cola only', 'Nothing — you should always be hungry'],
      correct: 1,
      explanation: 'A light carb snack like a banana or bread with honey gives quick fuel without making you feel heavy.'
    },
    {
      type: 'mc',
      question: 'Which is more important for everyone — sporty or not?',
      options: ['A balanced diet with fruit, veg, grains and protein', 'Lots of energy drinks', 'Only protein shakes', 'Only salad'],
      correct: 0,
      explanation: 'Whether you do sport or not, a balanced diet with all food groups is what keeps the body healthy.'
    },
    {
      type: 'tf',
      question: 'After hard training, athletes should eat or drink something with carbs and protein within about 1–2 hours.',
      correct: true,
      explanation: 'True. The "recovery window" helps muscles refill energy stores and repair faster — e.g. a sandwich with cheese or a yoghurt with fruit.'
    },
    {
      type: 'mc',
      question: 'What do top athletes mostly eat?',
      options: [
        'Mostly fast food and sweets',
        'A varied diet: lots of vegetables, fruit, whole grains, lean protein and enough water',
        'Only meat',
        'Only smoothies'
      ],
      correct: 1,
      explanation: 'Professional athletes follow balanced plans rich in vegetables, fruit, whole grains and lean protein, with extra carbs around training.'
    }
  ];

  let qIdx = 0;
  let score = 0;

  container.innerHTML = `
    <button class="back-btn" onclick="showMenu()">← Menu</button>
    <div class="content-card">
      <h2>⚽ Sport Nutrition Quiz</h2>
      <div class="sport-emojis">⚽ 🏃 💪 🥦 🍎 🥤 🏆</div>
      <div class="score-bar" id="qi-score">Score: 0 · Question 1 of ${questions.length}</div>
      <div id="qi-content"></div>
    </div>
  `;

  function render() {
    const c = document.getElementById('qi-content');
    if (qIdx >= questions.length) { renderEnd(); return; }
    const q = questions[qIdx];
    document.getElementById('qi-score').textContent = `Score: ${score} · Question ${qIdx + 1} of ${questions.length}`;
    let optsHtml = '';
    if (q.type === 'mc') {
      optsHtml = q.options.map((o, i) =>
        `<button class="option-btn" data-idx="${i}" onclick="window._qiAnswer(${i})">${String.fromCharCode(65+i)}) ${o}</button>`
      ).join('');
    } else {
      optsHtml = `
        <button class="option-btn" data-idx="true" onclick="window._qiAnswer(true)">True</button>
        <button class="option-btn" data-idx="false" onclick="window._qiAnswer(false)">False</button>
      `;
    }
    c.innerHTML = `
      <p class="question">${q.question}</p>
      <div class="options" id="qi-options">${optsHtml}</div>
      <div class="feedback" id="qi-feedback"></div>
      <div style="text-align:center;">
        <button class="nav-btn" id="qi-next" style="display:none;" onclick="window._qiNext()">Next →</button>
      </div>
    `;
  }

  window._qiAnswer = function(choice) {
    const q = questions[qIdx];
    document.querySelectorAll('#qi-options .option-btn').forEach(b => b.disabled = true);
    const fb = document.getElementById('qi-feedback');
    const isCorrect = (q.type === 'mc') ? (choice === q.correct) : (choice === q.correct);
    document.querySelectorAll('#qi-options .option-btn').forEach(b => {
      const sel = (q.type === 'mc') ? parseInt(b.dataset.idx) === choice : b.dataset.idx === String(choice);
      const corr = (q.type === 'mc') ? parseInt(b.dataset.idx) === q.correct : b.dataset.idx === String(q.correct);
      if (sel && !isCorrect) b.classList.add('wrong');
      if (corr) b.classList.add('correct');
    });
    if (isCorrect) {
      score++;
      fb.className = 'feedback show';
      fb.innerHTML = `<strong>✓ Correct! +1 point.</strong><br>${q.explanation}`;
    } else {
      fb.className = 'feedback show';
      fb.innerHTML = `<strong>✗ Not quite.</strong><br>${q.explanation}`;
    }
    document.getElementById('qi-score').textContent = `Score: ${score} · Question ${qIdx + 1} of ${questions.length}`;
    document.getElementById('qi-next').style.display = 'inline-block';
  };

  window._qiNext = function() { qIdx++; render(); };

  function renderEnd() {
    const c = document.getElementById('qi-content');
    let msg;
    const pct = score / questions.length;
    if (pct >= 0.8) msg = '🏆 Champion level — you eat smart like a pro athlete!';
    else if (pct >= 0.5) msg = '💪 Good job — solid knowledge of sport nutrition!';
    else msg = '⚽ Keep training your nutrition knowledge — you\'ll get there!';
    c.innerHTML = `
      <h3 style="text-align:center; color:#15803d;">Final Score: ${score} / ${questions.length}</h3>
      <p style="text-align:center; font-size:1.15rem;">${msg}</p>
      <div class="sources">
        <strong>Sources:</strong><br>
        • German Nutrition Society (DGE) — <a href="https://www.dge.de" target="_blank">dge.de</a><br>
        • NHS — Eating for sport — <a href="https://www.nhs.uk/live-well/eat-well/food-guidelines-and-food-labels/food-and-drink-tips-for-exercise/" target="_blank">nhs.uk</a><br>
        • IOC — Nutrition for athletes — <a href="https://olympics.com/ioc/medical-and-scientific-commission" target="_blank">olympics.com</a><br>
        • BZfE — <a href="https://www.bzfe.de" target="_blank">bzfe.de</a><br>
        • Mayo Clinic — Sports nutrition — <a href="https://www.mayoclinic.org/healthy-lifestyle/nutrition-and-healthy-eating" target="_blank">mayoclinic.org</a>
      </div>
      <div style="text-align:center;"><button class="nav-btn" onclick="initQuizI()">Restart</button></div>
    `;
  }

  render();
}

</script>
