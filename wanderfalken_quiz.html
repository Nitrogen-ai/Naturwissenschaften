<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wanderfalke · Sturzflug Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #0a0e1a;
    --accent: #e8a020;
    --accent2: #f0c060;
    --white: #f0ece4;
    --muted: #7a8a9a;
    --correct-light: #4aaa6a;
    --wrong-light: #cc4444;
    --hint: #4a90d9;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--sky);
    color: var(--white);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, #1a3060 0%, transparent 60%),
      linear-gradient(180deg, #060c1a 0%, #0a1428 40%, #080f1e 100%);
    z-index: -2;
  }
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(1px 1px at 15% 10%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 5%,  rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 15%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 8%,  rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 92% 20%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 25%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 3%,  rgba(255,255,255,0.6) 0%, transparent 100%);
    z-index: -1; pointer-events: none;
  }

  .wrapper { max-width: 780px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }

  /* HEADER */
  header { text-align: center; padding: 2.5rem 0 2rem; }
  .falcon-icon {
    font-size: 3.5rem; display: block; margin-bottom: 0.4rem;
    filter: drop-shadow(0 0 20px rgba(232,160,32,0.5));
    animation: soar 4s ease-in-out infinite;
  }
  @keyframes soar {
    0%,100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-8px) rotate(2deg); }
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.6rem,7vw,4.5rem);
    letter-spacing: 0.08em; line-height: 0.9;
    text-shadow: 0 0 40px rgba(232,160,32,0.3);
  }
  h1 span {
    color: var(--accent); display: block;
    font-size: clamp(1.2rem,3.5vw,2rem); letter-spacing: 0.3em;
  }
  .subtitle { margin-top: 0.8rem; color: var(--muted); font-size: 0.9rem; font-weight: 300; letter-spacing: 0.05em; }

  /* PROGRESS */
  .progress-label { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.4rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .progress-bar-wrap { margin: 0 0 1.5rem; height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
  .progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px; transition: width 0.6s cubic-bezier(0.4,0,0.2,1); box-shadow: 0 0 10px rgba(232,160,32,0.5); }

  .score-tracker { text-align: right; font-size: 0.82rem; color: var(--muted); margin-bottom: 0.8rem; letter-spacing: 0.05em; }
  .score-tracker span { color: var(--accent); font-weight: 600; }

  /* QUIZ CARD */
  .quiz-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 2.2rem 2.2rem 1.8rem;
    backdrop-filter: blur(10px);
    position: relative; overflow: hidden;
    animation: fadeSlide 0.4s ease forwards;
  }
  .quiz-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.5;
  }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .q-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.8rem; }
  .question-number { font-family: 'Bebas Neue', sans-serif; font-size: 0.8rem; letter-spacing: 0.2em; color: var(--accent); text-transform: uppercase; }
  .topic-tag { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 0.2rem 0.7rem; }

  .question-text { font-size: 1.18rem; font-weight: 600; line-height: 1.55; margin-bottom: 0.6rem; color: var(--white); }

  /* DENK-ANSTOSS */
  .hint-toggle {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.78rem; color: var(--hint); cursor: pointer;
    background: rgba(74,144,217,0.1); border: 1px solid rgba(74,144,217,0.25);
    border-radius: 20px; padding: 0.3rem 0.9rem;
    margin-bottom: 1.4rem;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .hint-toggle:hover { background: rgba(74,144,217,0.18); border-color: rgba(74,144,217,0.5); }

  .hint-box {
    display: none;
    background: rgba(74,144,217,0.08);
    border: 1px solid rgba(74,144,217,0.25);
    border-radius: 10px; padding: 0.9rem 1.1rem;
    margin-bottom: 1.4rem;
    font-size: 0.88rem; line-height: 1.65; color: #a8c8f0;
    animation: fadeIn 0.25s ease;
  }
  .hint-box.open { display: block; }
  .hint-box strong { color: var(--hint); }

  /* ANSWERS */
  .answers { display: grid; gap: 0.65rem; }
  .answer-btn {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.11);
    border-radius: 10px; padding: 0.9rem 1.1rem;
    text-align: left; color: var(--white);
    font-family: 'DM Sans', sans-serif; font-size: 0.94rem;
    cursor: pointer; transition: all 0.2s ease;
    display: flex; align-items: flex-start; gap: 0.9rem;
    position: relative; overflow: hidden; line-height: 1.45;
  }
  .answer-btn::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(232,160,32,0.06), transparent);
    opacity: 0; transition: opacity 0.2s;
  }
  .answer-btn:hover:not(:disabled)::before { opacity: 1; }
  .answer-btn:hover:not(:disabled) { border-color: rgba(232,160,32,0.4); transform: translateX(4px); }
  .answer-letter { font-family: 'Bebas Neue', sans-serif; font-size: 1.05rem; color: var(--accent); width: 1.4rem; flex-shrink: 0; letter-spacing: 0.05em; padding-top: 0.05rem; }
  .answer-btn.correct { background: rgba(42,122,74,0.2); border-color: var(--correct-light); transform: translateX(0) !important; }
  .answer-btn.correct .answer-letter { color: var(--correct-light); }
  .answer-btn.wrong   { background: rgba(138,42,42,0.2); border-color: var(--wrong-light); }
  .answer-btn.wrong .answer-letter { color: var(--wrong-light); }
  .answer-btn:disabled { cursor: default; }

  /* FEEDBACK */
  .feedback { margin-top: 1.2rem; padding: 1.1rem 1.2rem; border-radius: 10px; font-size: 0.9rem; line-height: 1.65; display: none; animation: fadeIn 0.3s ease; }
  .feedback.show { display: block; }
  .feedback.correct-fb { background: rgba(42,122,74,0.15); border: 1px solid rgba(74,170,106,0.3); color: #a0d8b0; }
  .feedback.wrong-fb   { background: rgba(138,42,42,0.15); border: 1px solid rgba(200,68,68,0.3);  color: #e8a0a0; }
  .feedback-icon { margin-right: 0.4rem; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }

  .next-btn {
    margin-top: 1.3rem; padding: 0.85rem 1.8rem;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 10px;
    color: #1a0e00; font-family: 'Bebas Neue', sans-serif;
    font-size: 1.05rem; letter-spacing: 0.12em;
    cursor: pointer; display: none;
    transition: all 0.2s ease;
    box-shadow: 0 4px 20px rgba(232,160,32,0.3);
  }
  .next-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(232,160,32,0.45); }
  .next-btn.show { display: inline-block; }

  /* ===== RESULT SCREEN ===== */
  #result-screen { display: none; text-align: center; }

  /* CONFETTI canvas */
  #confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 100; }

  .trophy-wrap { position: relative; display: inline-block; margin-bottom: 0.5rem; }
  .trophy { font-size: 5rem; display: block; animation: trophyBounce 0.8s cubic-bezier(0.4,0,0.2,1) both; }
  @keyframes trophyBounce {
    0%   { transform: scale(0) rotate(-20deg); opacity: 0; }
    60%  { transform: scale(1.2) rotate(5deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); }
  }

  .stars-row { font-size: 2rem; letter-spacing: 0.3rem; margin-bottom: 0.8rem; animation: fadeIn 0.6s 0.5s both; }

  .result-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.2rem, 6vw, 3.8rem); letter-spacing: 0.06em; color: var(--accent);
    margin-bottom: 0.4rem; animation: fadeIn 0.5s 0.3s both;
  }
  .result-score { font-size: 1rem; color: var(--muted); margin-bottom: 2rem; animation: fadeIn 0.5s 0.4s both; }

  .score-ring { width: 130px; height: 130px; margin: 0 auto 1.5rem; position: relative; animation: fadeIn 0.5s 0.6s both; }
  .score-ring svg { transform: rotate(-90deg); }
  .ring-bg   { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 8; }
  .ring-fill { fill: none; stroke: url(#ringGrad); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 1.4s cubic-bezier(0.4,0,0.2,1); }
  .score-number { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; color: var(--white); letter-spacing: 0.05em; }

  .result-message { font-size: 0.97rem; line-height: 1.75; color: var(--muted); max-width: 480px; margin: 0 auto 1.5rem; animation: fadeIn 0.5s 0.7s both; }

  .badge-row { display: flex; justify-content: center; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 2rem; animation: fadeIn 0.5s 0.9s both; }
  .badge { background: rgba(232,160,32,0.1); border: 1px solid rgba(232,160,32,0.3); border-radius: 20px; padding: 0.35rem 1rem; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent2); }

  .restart-btn {
    padding: 0.95rem 2.2rem;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 10px;
    color: #1a0e00; font-family: 'Bebas Neue', sans-serif;
    font-size: 1.15rem; letter-spacing: 0.12em;
    cursor: pointer; transition: all 0.2s ease;
    box-shadow: 0 4px 20px rgba(232,160,32,0.3);
    animation: fadeIn 0.5s 1s both;
  }
  .restart-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(232,160,32,0.45); }

  /* perfect-score glow pulse on title */
  .glow-pulse { animation: glowPulse 2s ease-in-out infinite; }
  @keyframes glowPulse {
    0%,100% { text-shadow: 0 0 20px rgba(232,160,32,0.4); }
    50%      { text-shadow: 0 0 50px rgba(240,192,96,0.9), 0 0 100px rgba(232,160,32,0.5); }
  }
</style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div class="wrapper">

  <header>
    <span class="falcon-icon">🦅</span>
    <h1>Wanderfalke<span>Sturzflug Quiz</span></h1>
    <p class="subtitle">Denk nach – du kannst es herausfinden!</p>
  </header>

  <div id="quiz-section">
    <div class="score-tracker">Punkte: <span id="current-score">0</span></div>
    <div class="progress-label">
      <span id="q-label">Frage 1 von 7</span>
      <span id="pct-label">0 %</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progress-bar" style="width:0%"></div>
    </div>

    <div class="quiz-card" id="quiz-card">
      <div class="q-meta">
        <div class="question-number" id="q-number">Frage 01</div>
        <div class="topic-tag" id="q-topic"></div>
      </div>
      <div class="question-text" id="q-text"></div>
      <button class="hint-toggle" id="hint-toggle" onclick="toggleHint()">💡 Denkanstoß zeigen</button>
      <div class="hint-box" id="hint-box"></div>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">Weiter →</button>
    </div>
  </div>

  <div id="result-screen">
    <div class="trophy-wrap"><span class="trophy" id="trophy-emoji">🏆</span></div>
    <div class="stars-row" id="stars-row"></div>
    <div class="result-title" id="result-title">Ergebnis</div>
    <div class="result-score" id="result-score"></div>
    <div class="score-ring">
      <svg width="130" height="130" viewBox="0 0 130 130">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   style="stop-color:#e8a020"/>
            <stop offset="100%" style="stop-color:#f0c060"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg"   cx="65" cy="65" r="54"/>
        <circle class="ring-fill" id="ring-fill" cx="65" cy="65" r="54"
          stroke-dasharray="339.3" stroke-dashoffset="339.3"/>
      </svg>
      <div class="score-number" id="score-number">0/7</div>
    </div>
    <div class="result-message" id="result-message"></div>
    <div class="badge-row" id="badge-row"></div>
    <button class="restart-btn" onclick="restartQuiz()">🔄 Nochmal versuchen</button>
  </div>

</div>

<script>
/* ============================================================
   FRAGEN  –  jede hat: q, topic, hint, options[], correct, explanation
   ============================================================ */
const questions = [

  /* ---------- BLOCK 1 – Sturzflug-Physik ---------- */
  {
    topic: "Luftwiderstand",
    q: "Der Wanderfalke legt im Sturzflug seine Flügel eng an den Körper an. Warum wird er dadurch so viel schneller?",
    hint: "🤔 Stell dir vor, du streckst die Hand aus einem fahrenden Auto – was passiert? Und was, wenn du die Hand zur Faust ballst und sie drehst? Wovon hängt ab, wie stark der Wind dagegen drückt?",
    options: [
      "Die Flügel wiegen dann weniger, deshalb fällt er schneller.",
      "Er hat dann eine schmalere Form – die Luft muss kaum ausweichen und bremst ihn kaum.",
      "Angelegte Flügel erzeugen mehr Auftrieb, der ihn nach unten drückt.",
      "Er kann mit angelegten Flügeln besser sehen, wo die Beute ist."
    ],
    correct: 1,
    explanation: "Das Stichwort heißt Luftwiderstand: Je schmaler und glatter ein Objekt ist, desto leichter kann die Luft drumherum strömen. Deshalb sind Sportwagen, Flugzeuge – und der Wanderfalke im Sturzflug – vorne spitz und hinten schmal. Der Falke bringt sich in eine perfekte Tropfenform."
  },

  {
    topic: "Schwerkraft & Energie",
    q: "Warum greift der Wanderfalke seine Beute von oben im Sturzflug an – und nicht einfach geradeaus im normalen Flug?",
    hint: "🤔 Was passiert mit einem Fahrrad, wenn du einen steilen Hügel hinunterrollst, ohne zu treten? Woher kommt diese extra Energie? Und welche Kraft der Natur hilft dabei?",
    options: [
      "Weil er von oben einen besseren Blick auf die Beute hat.",
      "Weil er beim Sturz von der Schwerkraft zusätzlich beschleunigt wird und so viel schneller wird.",
      "Weil Tauben nach oben schlechter sehen als nach vorne.",
      "Weil er nur vom Nest aus starten kann, das immer oben ist."
    ],
    correct: 1,
    explanation: "Die Schwerkraft zieht den Falken nach unten – genau wie ein Stein oder ein Fahrrad den Hügel hinunter immer schneller wird, ohne dass man etwas tun muss. Der Wanderfalke nutzt diese kostenlose Energie der Gravitation, um Geschwindigkeiten zu erreichen, die im normalen Flug unmöglich wären."
  },

  /* ---------- BLOCK 2 – Körperbau & Anpassung ---------- */
  {
    topic: "Körperbau",
    q: "Kleine Knochenvorsprünge in den Nasenlöchern des Wanderfalken leiten die Luft um. Was würde ohne sie beim Sturzflug mit 320 km/h passieren?",
    hint: "🤔 Öffne beim nächsten Radfahren kurz den Mund – was spürst du? Stell dir das bei 10× der Geschwindigkeit vor. Was würde mit der Luft in deiner Brust passieren?",
    options: [
      "Er könnte seine Beute nicht mehr riechen.",
      "Der enorme Luftdruck würde so stark in die Lungen gepresst, dass Atmen kaum möglich wäre.",
      "Die Federn würden sich aufstellen und er würde stark abbremsen.",
      "Er würde die Orientierung verlieren und im Kreis fliegen."
    ],
    correct: 1,
    explanation: "Beim Radfahren spürst du schon bei 20 km/h den Wind im Mund. Bei 320 km/h wäre der Druck so gewaltig, dass die Luft in die Lungen gepresst würde – wie aufgeblasen. Die winzigen Knochenvorsprünge (Tubercula) leiten den Luftstrom seitlich ab, sodass der Falke normal atmen kann."
  },

  {
    topic: "Kräfte beim Abbremsen",
    q: "Beim Abfangen aus dem Sturzflug wirken auf den Wanderfalken Kräfte, die etwa 10-mal so stark sind wie die Erdanziehungskraft. Was bedeutet das für seinen Körper?",
    hint: "🤔 Kennst du das Gefühl beim Anhalten eines Busses – du wirst nach vorne gedrückt? Wie stark wäre das, wenn der Bus nicht in 5 Sekunden, sondern in 0,2 Sekunden von 100 km/h auf null käme?",
    options: [
      "Sein Herz schlägt dann 10-mal schneller.",
      "Sein Körper wird so stark in eine Richtung gedrückt, als würde er 10-mal so schwer sein – das erfordert extrem starke Muskeln und Knochen.",
      "Er verliert für kurze Zeit sein Sehvermögen, weil das Blut aus den Augen fließt.",
      "Sein Gefieder wird durch den Druck flach gedrückt, was ihn bremst."
    ],
    correct: 1,
    explanation: "Beschleunigungskräfte (G-Kräfte) entstehen, wenn sich Geschwindigkeit sehr schnell ändert. Bei 10 g wirkt auf jeden Körperteil das 10-fache seines normalen Gewichts. Kampfpiloten verlieren ab ca. 5–9 g das Bewusstsein. Der Wanderfalke übersteht das dank besonderer Muskeln, Knochen und Blutgefäße."
  },

  /* ---------- BLOCK 3 – Vergleichende Flugprinzipien ---------- */
  {
    topic: "Flugprinzip: Form & Widerstand",
    q: "Ein Fallschirmspringer im freien Fall (ohne offenen Schirm) erreicht etwa 200 km/h. Der Wanderfalke schafft über 320 km/h. Beide fallen – warum ist der Falke so viel schneller?",
    hint: "🤔 Was ist der Unterschied zwischen einem Blatt Papier, das du flach fallen lässt, und demselben Papier, das du zu einer engen Röhre rollst? Was passiert mit ihrer Fallgeschwindigkeit? Woran liegt das?",
    options: [
      "Der Wanderfalke ist schwerer, deshalb fällt er schneller.",
      "Der Wanderfalke schlägt mit den Flügeln und drückt sich zusätzlich nach unten.",
      "Der Wanderfalke bringt sich in eine schlanke Tropfenform – dadurch hat er viel weniger Luftwiderstand als ein Mensch mit ausgestreckten Gliedmaßen.",
      "Der Wanderfalke fliegt in dünnerer Luft, wo es weniger Widerstand gibt."
    ],
    correct: 2,
    explanation: "Das Papierblatt fällt langsam (große Fläche, viel Luftwiderstand), die Röhre fällt schneller (kleine Fläche, wenig Widerstand). Genau das macht der Wanderfalke: Er macht sich so schmal wie möglich. Der Mensch dagegen hat Arme und Beine ausgestreckt – das bremst enorm."
  },

  {
    topic: "Flugprinzip: Auftrieb",
    q: "Warum kann eine Möwe gemächlich mit weit gespreizten Flügeln segeln, während der Wanderfalke genau das NICHT tut, wenn er schnell sein will?",
    hint: "🤔 Breite Flügel erzeugen Auftrieb – das hält den Vogel in der Luft. Aber was passiert gleichzeitig mit dem Luftwiderstand, wenn die Fläche größer wird? Kann beides gleichzeitig optimal sein?",
    options: [
      "Die Möwe ist schlauer und hat eine bessere Technik als der Falke.",
      "Breite Flügel erzeugen zwar Auftrieb, erhöhen aber gleichzeitig den Luftwiderstand – beim schnellen Sturzflug bremst das zu stark.",
      "Der Wanderfalke hat kleinere Flügel als die Möwe und kann sie deshalb nicht ausstrecken.",
      "Die Möwe spart damit Energie für die Verdauung."
    ],
    correct: 1,
    explanation: "Hier liegt ein echter Zielkonflikt vor: Breite Flügel = viel Auftrieb (gut zum Gleiten), aber auch viel Luftwiderstand (schlecht für Geschwindigkeit). Segler wie die Möwe wählen den Auftrieb. Rennvögel wie der Wanderfalke wählen die Geschwindigkeit – sie falten die Flügel ein und verzichten auf den Auftrieb."
  },

  {
    topic: "Flugprinzip: Kontrolle",
    q: "Der Sturzflug des Wanderfalken klingt wie ein einfaches Fallen. Aber er ist kein freier Fall – er ist ein kontrollierter Flug. Was unterscheidet die beiden?",
    hint: "🤔 Was passiert, wenn du auf einem Fahrrad bergab rollst und die Hände vom Lenker nimmst? Und was, wenn du lenkst? Wer steuert im freien Fall? Wer steuert beim Wanderfalken?",
    options: [
      "Beim freien Fall gibt es keine Luft – im Sturzflug schon.",
      "Der Wanderfalke ist im freien Fall, aber er denkt dabei an seine Beute.",
      "Im Sturzflug korrigiert der Falke aktiv Kurs, Winkel und Geschwindigkeit durch minimale Flügelanpassungen – er lenkt wie ein Pilot.",
      "Der Unterschied ist die Geschwindigkeit: freier Fall ist immer langsamer."
    ],
    correct: 2,
    explanation: "Im freien Fall gibt es keine Kontrolle – du fällst wohin die Schwerkraft dich zieht. Der Wanderfalke dagegen steuert seinen Sturzflug mit kleinen Flügelkorrekturen wie ein Pilot sein Flugzeug. Er berechnet dabei, wo die Beute in einigen Sekunden sein wird – und fliegt dorthin, nicht zum aktuellen Ort."
  }

];

/* ============================================================
   QUIZ LOGIK
   ============================================================ */
let current = 0, score = 0, answered = false, shuffled = [], hintOpen = false;

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function startQuiz() {
  shuffled = shuffle(questions);
  current = 0; score = 0;
  document.getElementById('current-score').textContent = 0;
  document.getElementById('quiz-section').style.display = 'block';
  document.getElementById('result-screen').style.display = 'none';
  stopConfetti();
  loadQuestion();
}

function loadQuestion() {
  answered = false; hintOpen = false;
  const q = shuffled[current];
  const total = shuffled.length;
  const pct = Math.round((current / total) * 100);

  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('q-label').textContent = `Frage ${current + 1} von ${total}`;
  document.getElementById('pct-label').textContent = pct + ' %';
  document.getElementById('q-number').textContent = `Frage ${String(current + 1).padStart(2,'0')}`;
  document.getElementById('q-topic').textContent = q.topic;
  document.getElementById('q-text').textContent = q.q;

  // Hint
  const hb = document.getElementById('hint-box');
  hb.innerHTML = q.hint;
  hb.classList.remove('open');
  document.getElementById('hint-toggle').textContent = '💡 Denkanstoß zeigen';

  // Answers
  const letters = ['A','B','C','D'];
  const container = document.getElementById('answers');
  container.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.innerHTML = `<span class="answer-letter">${letters[i]}</span>${opt}`;
    btn.onclick = () => selectAnswer(i, q.correct, q.explanation);
    container.appendChild(btn);
  });

  const fb = document.getElementById('feedback');
  fb.className = 'feedback'; fb.innerHTML = '';
  document.getElementById('next-btn').classList.remove('show');
  document.getElementById('next-btn').textContent = 'Weiter →';

  // Animate card
  const card = document.getElementById('quiz-card');
  card.style.animation = 'none'; void card.offsetWidth;
  card.style.animation = 'fadeSlide 0.4s ease forwards';
}

function toggleHint() {
  hintOpen = !hintOpen;
  document.getElementById('hint-box').classList.toggle('open', hintOpen);
  document.getElementById('hint-toggle').textContent = hintOpen ? '💡 Denkanstoß verbergen' : '💡 Denkanstoß zeigen';
}

function selectAnswer(index, correct, explanation) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.answer-btn');
  btns.forEach(b => b.disabled = true);
  const fb = document.getElementById('feedback');

  if (index === correct) {
    score++;
    document.getElementById('current-score').textContent = score;
    btns[index].classList.add('correct');
    fb.className = 'feedback correct-fb show';
    fb.innerHTML = `<span class="feedback-icon">✅</span><strong>Richtig!</strong> ${explanation}`;
  } else {
    btns[index].classList.add('wrong');
    btns[correct].classList.add('correct');
    fb.className = 'feedback wrong-fb show';
    fb.innerHTML = `<span class="feedback-icon">❌</span><strong>Nicht ganz.</strong> ${explanation}`;
  }

  const nb = document.getElementById('next-btn');
  nb.classList.add('show');
  if (current === shuffled.length - 1) nb.textContent = 'Ergebnis sehen →';
}

function nextQuestion() {
  current++;
  if (current >= shuffled.length) showResult();
  else loadQuestion();
}

/* ============================================================
   ERGEBNIS
   ============================================================ */
function showResult() {
  document.getElementById('quiz-section').style.display = 'none';
  const rs = document.getElementById('result-screen');
  rs.style.display = 'block';

  const total = shuffled.length;
  const pct = score / total;

  document.getElementById('score-number').textContent = `${score}/${total}`;
  document.getElementById('result-score').textContent = `Du hast ${score} von ${total} Fragen richtig beantwortet`;

  // Stars
  const stars = pct === 1 ? '⭐⭐⭐' : pct >= 0.71 ? '⭐⭐' : pct >= 0.43 ? '⭐' : '';
  document.getElementById('stars-row').textContent = stars;

  // Trophy emoji & title
  let trophy, title, msg, badges;
  const titleEl = document.getElementById('result-title');

  if (pct === 1) {
    trophy = '🏆'; title = 'Perfekter Sturzflug!';
    msg = 'Unglaublich – du hast alle 7 Fragen richtig! Du denkst wie ein echter Naturforscher: Du verbindest Beobachtungen mit Erklärungen. Der Wanderfalke wäre stolz auf dich.';
    badges = ['Luftwiderstand-Experte', 'Physik-Falke', 'Meisterdenker'];
    titleEl.classList.add('glow-pulse');
    launchConfetti();
  } else if (pct >= 0.71) {
    trophy = '🥇'; title = 'Meisterfalke!';
    msg = 'Sehr stark! Du verstehst die Physik hinter dem Sturzflug richtig gut. Beim nächsten Versuch packst du den Rest auch noch.';
    badges = ['Physik-Falke', 'Scharfer Denker'];
    titleEl.classList.remove('glow-pulse');
  } else if (pct >= 0.43) {
    trophy = '🥈'; title = 'Guter Flug!';
    msg = 'Schon solide! Denk beim nächsten Mal an die Denkanstöße – die helfen dir, die Fragen durch eigenes Nachdenken zu lösen. Du schaffst mehr!';
    badges = ['Im Training'];
    titleEl.classList.remove('glow-pulse');
  } else {
    trophy = '🐣'; title = 'Noch am Start!';
    msg = 'Kein Problem – Physik braucht Übung. Nutze beim nächsten Mal die Denkanstöße und überleg Schritt für Schritt. Du wirst überrascht sein, wie viel du schon weißt!';
    badges = ['Mutig dabei'];
    titleEl.classList.remove('glow-pulse');
  }

  document.getElementById('trophy-emoji').textContent = trophy;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-message').textContent = msg;

  const br = document.getElementById('badge-row');
  br.innerHTML = badges.map(b => `<span class="badge">${b}</span>`).join('');

  // Ring animation
  const circumference = 339.3;
  const offset = circumference - pct * circumference;
  setTimeout(() => {
    document.getElementById('ring-fill').style.strokeDashoffset = offset;
  }, 300);
}

function restartQuiz() {
  document.getElementById('result-title').classList.remove('glow-pulse');
  startQuiz();
}

/* ============================================================
   KONFETTI
   ============================================================ */
let confettiAnim = null;
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
let particles = [];

function launchConfetti() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  particles = Array.from({length: 160}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    w: 6 + Math.random() * 8,
    h: 3 + Math.random() * 5,
    color: ['#e8a020','#f0c060','#4aaa6a','#4a90d9','#e05050','#f0f0a0'][Math.floor(Math.random()*6)],
    rot: Math.random() * Math.PI * 2,
    rotV: (Math.random() - 0.5) * 0.15,
    vx: (Math.random() - 0.5) * 2.5,
    vy: 2 + Math.random() * 3.5,
    opacity: 1
  }));
  let tick = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    tick++;
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.rotV;
      if (tick > 120) p.opacity -= 0.012;
      if (p.opacity < 0) p.opacity = 0;
      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    if (particles.some(p => p.opacity > 0)) {
      confettiAnim = requestAnimationFrame(draw);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  if (confettiAnim) cancelAnimationFrame(confettiAnim);
  draw();
}

function stopConfetti() {
  if (confettiAnim) { cancelAnimationFrame(confettiAnim); confettiAnim = null; }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

startQuiz();
</script>
